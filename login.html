<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alphagram — Login</title>
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<script>try{var t=localStorage.getItem('alpha_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--t1:#4f46e5;--t2:#6366f1;--t3:#818cf8;--card:#ffffff;--text:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f8fafc;--bad:#ef4444;--badbg:#fef2f2;--ease:cubic-bezier(.22,1,.36,1);--dur:.55s}
[data-theme=dark]{--card:#0f172a;--text:#f8fafc;--mut:#94a3b8;--line:#1e293b;--soft:#1e293b;--badbg:#311215}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 14px;color:var(--text);
 font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:#ffffff}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--t3);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Pure White Background Scene (All views) ---------- */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#ffffff}

/* ---------- Card ---------- */
.card{width:min(100%,400px);border-radius:36px;overflow:hidden;position:relative;background:var(--card);
 border:1px solid #e2e8f0;box-shadow:0 10px 40px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);animation:in .7s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.97)}}
.hd{height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:30px;color:#ffffff;
 background:linear-gradient(135deg,#4f46e5 0%,#3730a3 100%);transition:height var(--dur) var(--ease)}
.logo{width:92px;height:84px;transition:width var(--dur) var(--ease),height var(--dur) var(--ease);filter:drop-shadow(0 0 12px rgba(129,140,248,.6))}
.brand{font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin-top:4px;transition:font-size var(--dur) var(--ease)}
.tag{font-size:14px;color:#c7d2fe;max-height:24px;overflow:hidden;transition:max-height var(--dur) var(--ease),opacity var(--dur)}
body[data-mode=register] .hd{height:180px;padding-bottom:34px}
body[data-mode=register] .logo{width:50px;height:46px}
body[data-mode=register] .brand{font-size:24px}
body[data-mode=register] .tag{max-height:0;opacity:0}

.bd{position:relative;margin-top:-30px;border-radius:34px 34px 0 0;background:var(--card);padding:46px 24px 26px}
.switch{position:absolute;top:-22px;left:50%;translate:-50% 0;width:250px;display:grid;grid-template-columns:1fr 1fr;padding:4px;
 border-radius:99px;background:var(--card);box-shadow:0 4px 16px rgba(0,0,0,0.06);border:1px solid var(--line)}
.switch button{position:relative;z-index:1;padding:10px 0;font-weight:700;font-size:14px;color:var(--mut);transition:color .35s}
.switch button[aria-selected=true]{color:#fff}
.thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:linear-gradient(90deg,#4f46e5,#6366f1);transition:transform var(--dur) var(--ease)}
body[data-mode=register] .thumb{transform:translateX(100%)}

/* ---------- Panels ---------- */
.panels{position:relative;transition:height var(--dur) var(--ease)}
.panel{position:absolute;top:0;left:0;width:100%;transition:transform var(--dur) var(--ease),opacity .4s,visibility 0s linear var(--dur)}
.panel.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
#p-login.is-hidden{transform:translateX(-50px)}#p-register.is-hidden{transform:translateX(50px)}
.panel:not(.is-hidden){transition-delay:.1s,.1s,0s}
.panel:not(.is-hidden) .st{animation:rise .5s var(--ease) both}
.st:nth-child(2){animation-delay:.06s!important}.st:nth-child(3){animation-delay:.1s!important}.st:nth-child(4){animation-delay:.14s!important}
.st:nth-child(5){animation-delay:.18s!important}.st:nth-child(6){animation-delay:.22s!important}.st:nth-child(7){animation-delay:.26s!important}.st:nth-child(8){animation-delay:.3s!important}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---------- Form ---------- */
.msg{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;font-size:13px;margin-bottom:18px;background:var(--soft);color:var(--t1)}
[data-theme=dark] .msg{color:var(--t3)}
.msg.error{background:var(--badbg);color:var(--bad)}
.field{margin-bottom:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin-bottom:2px}
label .i{width:18px;height:18px}
.w{position:relative}
input[type=email],input[type=password],input[type=text]{width:100%;padding:8px 34px 9px 28px;border:0;border-bottom:1.5px solid var(--line);border-radius:0;background:transparent;outline:0;color:var(--text);transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--mut);opacity:.8}
input:focus{border-bottom-color:var(--t1);box-shadow:0 1px 0 var(--t1)}
input.ok{border-bottom-color:var(--t2)}input.bad{border-bottom-color:var(--bad);box-shadow:0 1px 0 var(--bad)}
.eye{position:absolute;right:0;top:50%;translate:0 -50%;width:30px;height:30px;display:grid;place-items:center;color:var(--mut);border-radius:8px}
.eye .off{display:none}.eye.shown .on{display:none}.eye.shown .off{display:block}
.bars{display:flex;gap:4px;margin-top:8px}.bars b{flex:1;height:3px;border-radius:4px;background:var(--line);transition:background .3s}
.hint{margin-top:4px;font-size:12px;color:var(--mut)}
.opts{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 20px}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.chk input{appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.chk input:checked{background:var(--t1);border-color:var(--t1)}
.chk input:checked::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;rotate:-45deg;translate:0 -1px}
.terms{align-items:flex-start;font-size:13px;margin-bottom:18px}.terms input{margin-top:1px}
a{color:var(--t1);font-weight:700;text-decoration:none}[data-theme=dark] a{color:var(--t3)}a:hover{text-decoration:underline}
.forgot{font-style:italic}
.go{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;border-radius:99px;color:#fff;font-weight:700;font-size:16px;
 background:linear-gradient(90deg,#4338ca,#4f46e5 50%,#6366f1);box-shadow:0 8px 20px rgba(79,70,229,.25);transition:transform .15s,box-shadow .2s,opacity .2s}
.go:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 26px rgba(79,70,229,.35)}
.go:active:not(:disabled){transform:scale(.98)}.go:disabled{opacity:.7;cursor:wait}
.sp{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.loading .sp{display:block}.loading .lb,.loading .i{display:none}@keyframes sp{to{rotate:360deg}}
.or{display:flex;align-items:center;gap:14px;margin:20px 0 14px;color:var(--mut);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.soc button{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;background:#ffffff;transition:background .2s,border-color .2s}
.soc button:hover{background:var(--soft);border-color:var(--t2)}.soc .i{fill:currentColor;stroke:none}.soc .g{fill:initial}
.sw{margin-top:18px;text-align:center;color:var(--text)}.sw button{color:var(--t1);font-weight:800;font-size:16px;margin-left:6px}[data-theme=dark] .sw button{color:var(--t3)}.sw button:hover{text-decoration:underline}
.shake{animation:shk .4s!important}@keyframes shk{20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
@media(max-width:420px){.bd{padding:46px 18px 22px}.row{grid-template-columns:1fr;gap:0}.hd{height:230px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body data-mode="login">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="at" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
<symbol id="login" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></symbol>
<symbol id="add" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></symbol>
<symbol id="eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="eyeoff" viewBox="0 0 24 24"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.9 9.9 0 0 1 12 5c7 0 11 7 11 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/></symbol>
</defs></svg>

<div class="scene" aria-hidden="true"></div>

<main class="card" id="card">
 <header class="hd">
  <svg class="logo" viewBox="0 0 64 60" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
   <path fill="url(#lg)" fill-rule="evenodd" stroke="#a5b4fc" stroke-width="1.5" stroke-linejoin="round" d="M30 3 6 57h13l4-10h14l4 10h13zM30 22l6 16H24z"/>
   <g fill="none" stroke="#c7d2fe" stroke-width=".9" stroke-linecap="round" opacity=".9"><path d="M20 44c14-4 22-14 36-26"/><path d="M22 47c14-2 24-10 38-18"/><path d="M26 49c12 0 24-4 34-10"/></g>
   <g fill="#e0e7ff"><circle cx="56" cy="18" r="1.2"/><circle cx="60" cy="29" r="1.2"/><circle cx="60" cy="39" r="1.2"/></g></svg>
  <div class="brand">Alphagram</div>
  <div class="tag">Connect • Chat • Share</div>
 </header>

 <section class="bd">
  <div class="switch" role="tablist" aria-label="Login or sign up">
   <div class="thumb"></div>
   <button type="button" role="tab" id="tab-login" aria-selected="true" data-mode="login">Login</button>
   <button type="button" role="tab" id="tab-register" aria-selected="false" data-mode="register">Sign up</button>
  </div>

  <div class="panels" id="panels">
   <div class="panel" id="p-login">
    <form id="loginForm" novalidate>
     <div class="msg st" id="loginMsg" role="status"><svg class="i"><use href="#info"/></svg><span></span></div>
     <div class="field st"><label for="l-email"><svg class="i"><use href="#mail"/></svg>Email</label>
      <div class="w"><input id="l-email" type="email" placeholder="you@example.com" autocomplete="username" required></div></div>
     <div class="field st"><label for="l-pass"><svg class="i"><use href="#lock"/></svg>Password</label>
      <div class="w"><input id="l-pass" type="password" placeholder="Password" autocomplete="current-password" required>
       <button type="button" class="eye" data-t="l-pass" aria-label="Show password"><svg class="i on"><use href="#eye"/></svg><svg class="i off"><use href="#eyeoff"/></svg></button></div></div>
     <div class="opts st"><label class="chk"><input type="checkbox" id="l-rem"> Remember me</label><a href="#" class="forgot" id="forgot">Forgot Password?</a></div>
     <button class="go st" type="submit" id="loginBtn"><svg class="i"><use href="#login"/></svg><span class="lb">Login</span><span class="sp"></span></button>
     <div class="or st">or continue with</div>
     <div class="soc st">
      <button type="button" data-soc="Google"><svg class="i g" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 0 1 0-4.18V7.07H2.18a11 11 0 0 0 0 9.86l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Google</button>
      <button type="button" data-soc="Apple"><svg class="i" viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8C6.9 7.5 5.4 8.4 4.6 9.8c-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.8 2.5 3.1 2.5 1.200-.1 1.700-.8 3.200-.8s1.900.8 3.200.8c1.300 0 2.200-1.200 3-2.400.9-1.300 1.300-2.600 1.300-2.700-.1 0-2.600-1-2.700-3.900zM14.100 5.700c.7-.8 1.100-1.900 1-3-1 0-2.100.7-2.800 1.500-.6.700-1.200 1.800-1 2.900 1.100.1 2.100-.5 2.800-1.400z"/></svg>Apple</button>
     </div>
     <p class="sw st">Don't have an account?<button type="button" data-mode="register">Sign up</button></p>
    </form>
   </div>

   <div class="panel is-hidden" id="p-register" inert>
    <form id="regForm" novalidate>
     <div class="msg st" id="regMsg" role="status"><svg class="i"><use href="#info"/></svg><span></span></div>
     <div class="row st">
      <div class="field"><label for="r-first"><svg class="i"><use href="#user"/></svg>First name</label><div class="w"><input id="r-first" type="text" placeholder="First name" autocomplete="given-name" required></div></div>
      <div class="field"><label for="r-last"><svg class="i"><use href="#user"/></svg>Last name</label><div class="w"><input id="r-last" type="text" placeholder="Last name" autocomplete="family-name" required></div></div>
     </div>
     <div class="field st"><label for="r-user"><svg class="i"><use href="#at"/></svg>Username</label><div class="w"><input id="r-user" type="text" placeholder="yourusername" autocomplete="username" required></div></div>
     <div class="field st"><label for="r-email"><svg class="i"><use href="#mail"/></svg>Email</label><div class="w"><input id="r-email" type="email" placeholder="you@example.com" autocomplete="email" required></div></div>
     <div class="field st"><label for="r-pass"><svg class="i"><use href="#lock"/></svg>Password</label>
      <div class="w"><input id="r-pass" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
       <button type="button" class="eye" data-t="r-pass" aria-label="Show password"><svg class="i on"><use href="#eye"/></svg><svg class="i off"><use href="#eyeoff"/></svg></button></div>
      <div class="bars" id="bars"><b></b><b></b><b></b><b></b></div><div class="hint" id="hint">Add numbers and symbols.</div></div>
     <div class="field st"><label for="r-conf"><svg class="i"><use href="#lock"/></svg>Confirm password</label>
      <div class="w"><input id="r-conf" type="password" placeholder="Repeat password" autocomplete="new-password" required>
       <button type="button" class="eye" data-t="r-conf" aria-label="Show password"><svg class="i on"><use href="#eye"/></svg><svg class="i off"><use href="#eyeoff"/></svg></button></div></div>
     <label class="chk terms st"><input type="checkbox" id="r-terms"><span>I agree to the <a href="#" id="terms">Terms</a> and <a href="#" id="privacy">Privacy Policy</a>.</span></label>
     <button class="go st" type="submit" id="regBtn"><svg class="i"><use href="#add"/></svg><span class="lb">Create account</span><span class="sp"></span></button>
     <p class="sw st">Already have an account?<button type="button" data-mode="login">Login</button></p>
    </form>
   </div>
  </div>
 </section>
</main>

<script>
const API='https://alpha-auth.murwanashyakadieumerci540.workers.dev',TK='alpha_token',UK='alpha_user',HOME='index.html';
const $=id=>document.getElementById(id);
if(localStorage.getItem(TK)&&localStorage.getItem(UK))location.replace(HOME);

/* mode switch */
const panels=$('panels'),pm={login:$('p-login'),register:$('p-register')},titles={login:'Alphagram — Login',register:'Alphagram — Sign up'};
let mode='login';
const fit=()=>{panels.style.height=pm[mode].offsetHeight+'px'};
function apply(){
 document.body.dataset.mode=mode;document.title=titles[mode];
 for(const k in pm){const on=k===mode;pm[k].classList.toggle('is-hidden',!on);on?pm[k].removeAttribute('inert'):pm[k].setAttribute('inert','')}
 $('tab-login').setAttribute('aria-selected',mode==='login');$('tab-register').setAttribute('aria-selected',mode==='register');
}
function setMode(m){if(m===mode)return;mode=m;apply();fit();try{history.replaceState(null,'',m==='register'?'register.html':'login.html')}catch(e){}}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
const ro=new ResizeObserver(fit);Object.values(pm).forEach(p=>ro.observe(p));addEventListener('resize',fit);
mode=/register/i.test(location.pathname)||new URLSearchParams(location.search).get('mode')==='register'?'register':'login';
apply();panels.style.transition='none';fit();requestAnimationFrame(()=>requestAnimationFrame(()=>panels.style.transition=''));

/* helpers */
const DEF={loginMsg:'Welcome back! Sign in to continue.',regMsg:'Join Alphagram in a minute.'};
function say(id,text,type){const el=$(id);el.className='msg st'+(type?' '+type:'');el.querySelector('span').textContent=text||DEF[id]}
say('loginMsg');say('regMsg');
const shake=()=>{const c=$('card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')};
document.querySelectorAll('.eye').forEach(b=>b.addEventListener('click',()=>{const i=$(b.dataset.t),s=i.type==='password';i.type=s?'text':'password';b.classList.toggle('shown',s);b.setAttribute('aria-label',s?'Hide password':'Show password')}));
document.querySelectorAll('[data-soc]').forEach(b=>b.addEventListener('click',()=>say(mode==='login'?'loginMsg':'regMsg',b.dataset.soc+' sign-in is coming soon.')));
async function post(path,body){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
 try{
  const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d.error||d.message||'Request failed ('+r.status+')');return d;
 }catch(e){throw new Error(e.name==='AbortError'?'Connection too slow. Try again.':e.message)}finally{clearTimeout(t)}
}
function save(data,email,name){
 const token=data.token||data.access_token||data.jwt;if(!token)throw new Error('No token received.');
 localStorage.setItem(TK,token);const u=data.user||data;
 localStorage.setItem(UK,JSON.stringify({CU:{id:u.email||email,email:u.email||email},UP:{display_name:name||u.display_name||u.name||email.split('@')[0],bio:u.bio||'',avatar_color:u.avatar_color||'g2',avatar_url:u.avatar_url||null}}));
}
const busy=(b,on)=>{b.disabled=on;b.classList.toggle('loading',on)};

/* login */
const saved=localStorage.getItem('alphaRemember');if(saved){$('l-email').value=saved;$('l-rem').checked=true}
$('forgot').addEventListener('click',e=>{e.preventDefault();say('loginMsg','Password reset is coming soon.')});
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();const email=$('l-email').value.trim(),pass=$('l-pass').value,b=$('loginBtn');
 if(!email){say('loginMsg','Enter your email.','error');shake();return $('l-email').focus()}
 if(pass.length<6){say('loginMsg','Password needs 6+ characters.','error');shake();return $('l-pass').focus()}
 busy(b,true);say('loginMsg');
 try{
  save(await post('/login',{email,password:pass}),email);
  $('l-rem').checked?localStorage.setItem('alphaRemember',email):localStorage.removeItem('alphaRemember');
  say('loginMsg','Signed in. Opening…');setTimeout(()=>location.href=HOME,400);
 }catch(err){say('loginMsg',err.message||'Login failed.','error');shake();busy(b,false)}
});

/* register */
const rp=$('r-pass'),rc=$('r-conf'),bars=document.querySelectorAll('#bars b');
const cols=['var(--line)','#ef4444','#f59e0b','#6366f1','#4f46e5'],hints=['Add numbers and symbols.','Weak','Fair','Good','Strong'];
function match(){if(!rc.value){rc.classList.remove('ok','bad');return}const s=rp.value===rc.value;rc.classList.toggle('ok',s);rc.classList.toggle('bad',!s)}
rp.addEventListener('input',()=>{const v=rp.value;let n=0;if(v.length>=8)n++;if(/[A-Z]/.test(v))n++;if(/\d/.test(v))n++;if(/[^A-Za-z0-9]/.test(v))n++;
 bars.forEach((b,i)=>b.style.background=i<n?cols[n]:cols[0]);$('hint').textContent=v?hints[n]:hints[0];match()});
rc.addEventListener('input',match);
$('r-user').addEventListener('input',function(){this.value=this.value.replace(/\s/g,'').replace(/^@+/,'')});
$('terms').addEventListener('click',e=>{e.preventDefault();say('regMsg','Terms coming soon.')});
$('privacy').addEventListener('click',e=>{e.preventDefault();say('regMsg','Privacy Policy coming soon.')});
$('regForm').addEventListener('submit',async e=>{
 e.preventDefault();const f=$('r-first').value.trim(),l=$('r-last').value.trim(),u=$('r-user').value.trim(),email=$('r-email').value.trim(),pass=rp.value,b=$('regBtn');
 const bad=(t,el)=>{say('regMsg',t,'error');shake();el&&el.focus()};
 if(!f||!l)return bad('Enter your full name.',$('r-first'));
 if(u.length<3)return bad('Username needs 3+ characters.',$('r-user'));
 if(!email)return bad('Enter your email.',$('r-email'));
 if(pass.length<8)return bad('Password needs 8+ characters.',rp);
 if(pass!==rc.value)return bad('Passwords don\'t match.',rc);
 if(!$('r-terms').checked)return bad('Accept the Terms to continue.');
 busy(b,true);say('regMsg');
 try{
  const name=(f+' '+l).trim();
  save(await post('/signup',{email,password:pass,display_name:name,username:u}),email,name);
  say('regMsg','Account created. Opening…');setTimeout(()=>location.href=HOME,800);
 }catch(err){bad(err.message||'Sign up failed.');busy(b,false)}
});
</script>
</body>
</html>
