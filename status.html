<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alphagram — Status</title>
<script src="alpha-common.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.4}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
.sidebar{width:232px;position:fixed;inset:0 auto 0 0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 12px;z-index:50}
.wordmark{display:flex;align-items:center;gap:10px;padding:2px 10px 20px;font-weight:800;font-size:1.4rem;letter-spacing:-.5px}
.wordmark i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--on-primary);font-style:normal;font-size:1.1rem;background:var(--primary)}
.nav{display:flex;flex-direction:column;gap:3px;overflow:auto}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text-secondary);font-weight:600;font-size:.88rem;text-align:left}
.nav button i{width:18px;text-align:center}.nav button:hover{background:var(--surface);color:var(--text)}.nav button.active{background:var(--primary-l);color:var(--primary)}
.main{margin-left:232px;width:calc(100% - 232px)}
.topbar{height:64px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:0 32px;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar h1{font-size:1.35rem;letter-spacing:-.4px}.topbar .sp{margin-left:auto;color:var(--text-secondary);font-size:.82rem}
.wrap{max-width:1040px;margin:0 auto;padding:26px 28px 90px}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--surface);flex-shrink:0}
.me-chip{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.86rem;font-weight:700}.me-chip .av{width:34px;height:34px}
.cols{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,460px);justify-content:center;gap:28px;align-items:start}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card h3{font-size:.9rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}.card h3 small{color:var(--muted);font-weight:500;font-size:.75rem}
.stage{position:relative;height:min(600px,66vh);aspect-ratio:9/16;max-width:100%;margin:0 auto;border-radius:22px;overflow:hidden;background-color:var(--card);border:2px dashed var(--border);transition:border-color .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.stage.has{border-style:solid;box-shadow:var(--shadow)}
.stage.drag{border-style:solid;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-l)}
.empty{text-align:center;padding:30px;max-width:340px}
.orb{width:68px;height:68px;border-radius:18px;background:var(--primary-l);color:var(--primary);display:grid;place-items:center;font-size:26px;margin:0 auto 14px}
.empty h2{font-size:1.1rem}.empty p{color:var(--text-secondary);font-size:.86rem;margin:4px 0 16px}.empty small{display:block;margin-top:14px;color:var(--muted);font-size:.76rem}
.btn{padding:10px 16px;border-radius:11px;font-size:.84rem;font-weight:700;background:var(--surface)}.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--primary);color:#fff}.btn.pri:disabled{opacity:.45;cursor:not-allowed}.btn.block{width:100%;padding:13px;font-size:.92rem}
.btn.danger{background:rgba(229,72,77,.12);color:var(--danger)}
.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.4),transparent 28%,transparent 62%,rgba(0,0,0,.55))}
.ptop{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none}
.ptop>*{pointer-events:auto}
.who{display:flex;align-items:center;gap:8px;color:#fff;font-size:.82rem;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.5)}.who img{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.4);object-fit:cover}
.chip{background:rgba(0,0,0,.45);color:#fff;font-size:.75rem;font-weight:700;padding:5px 10px;border-radius:99px}
.x{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}.x:hover{background:var(--danger)}
.pcap{position:absolute;left:18px;right:18px;bottom:20px;z-index:3;color:#fff;font-size:1rem;text-shadow:0 2px 10px rgba(0,0,0,.7);max-height:90px;overflow:auto;word-break:break-word}
.busy{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.queue{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}.queue::-webkit-scrollbar{display:none}
.qt{position:relative;flex:0 0 68px;height:68px;border-radius:12px;overflow:hidden;border:2px solid var(--border);background:var(--surface);cursor:pointer}.qt.on{border-color:var(--primary)}
.qt img,.qt video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.qt button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:.65rem}
.qa{flex:0 0 68px;height:68px;border-radius:12px;border:2px dashed var(--border);color:var(--muted);display:grid;place-items:center}.qa:hover{border-color:var(--primary);color:var(--primary)}
textarea{width:100%;min-height:90px;resize:none;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 13px;outline:0}textarea:focus{border-color:var(--primary)}
.cnt{text-align:right;color:var(--muted);font-size:.72rem;margin-top:4px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:12px;cursor:pointer;width:100%;text-align:left}.opt:hover{background:var(--surface)}
.opt .ic{width:36px;height:36px;border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--text-secondary);flex-shrink:0}
.opt b{display:block;font-size:.9rem}.opt span{display:block;color:var(--text-secondary);font-size:.78rem}.opt div{flex:1}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);position:relative;flex-shrink:0}
.opt.on .r{border-color:var(--primary)}.opt.on .r::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
.note{text-align:center;color:var(--muted);font-size:.76rem;margin-top:8px}
.mine{margin-top:26px}.mine h2{font-size:1.05rem;display:flex;justify-content:space-between;margin:0 4px 12px}.mine h2 span{color:var(--muted);font-size:.85rem;font-weight:500}
.sc{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:10px}
.th{position:relative;width:58px;height:58px;border-radius:12px;background:var(--surface);overflow:hidden;display:grid;place-items:center;color:var(--muted);flex-shrink:0}.th img,.th video{width:100%;height:100%;object-fit:cover}
.th i.pl{position:absolute;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.si{flex:1;min-width:0}.si b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.si span{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--text-secondary);font-size:.78rem;margin-top:3px}
.sa{display:flex;gap:6px}.sa button{width:36px;height:36px;border-radius:11px;background:var(--surface);color:var(--text-secondary)}.sa button:hover{background:var(--primary-l);color:var(--primary)}.sa .del:hover{background:var(--danger);color:#fff}
.none{text-align:center;color:var(--text-secondary);padding:26px 10px;background:var(--card);border:1px dashed var(--border);border-radius:16px}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:500}.ov.show{display:flex}
.modal{width:100%;max-width:400px;max-height:80vh;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:800}.mh button{width:32px;height:32px;border-radius:50%;background:var(--surface)}
.tabs{display:flex;gap:6px;padding:10px 14px}.tabs button{flex:1;padding:8px;border-radius:10px;background:var(--surface);color:var(--text-secondary);font-weight:700;font-size:.82rem}.tabs button.on{background:var(--primary-l);color:var(--primary)}
.ml{overflow-y:auto;padding:4px 12px 14px}.ir{display:flex;align-items:center;gap:10px;padding:8px 4px}.ir img{width:36px;height:36px;border-radius:50%;object-fit:cover}.ir b{flex:1;font-size:.88rem}.ir small{color:var(--muted)}
.mnav{display:none}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}#list .none{grid-column:1/-1}
.sc{margin-bottom:0;animation:ag-rise .35s var(--ag-ease) both}.sc:nth-child(n+7){animation:none}
.ov .modal{padding:0}
@media(max-width:900px){
.sidebar{display:none}.main{margin-left:0;width:100%}.topbar{padding:0 16px}.wrap{padding:16px 14px 100px}
.cols{grid-template-columns:1fr;gap:16px}.stage{height:min(520px,62vh)}
.mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0 0;height:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--border);z-index:200}
.mnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.66rem;font-weight:600;color:var(--text-secondary)}.mnav button.on{color:var(--primary)}.mnav i{font-size:1.1rem}
.sa button{width:32px;height:32px}.th{width:48px;height:48px}.topbar .sp{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="stylesheet" href="alphagram.css">
</head>
<body>
<div class="app">
 <aside class="sidebar"><div class="wordmark"><i>A</i>Alphagram</div><nav class="nav" id="side"></nav></aside>
 <main class="main">
  <header class="topbar"><h1>Status</h1><div class="me-chip"><span id="meName"></span><img class="av" id="meAv" alt=""></div></header>
  <section class="wrap">
   <div class="cols">
    <div>
     <div class="stage" id="messages">
      <div class="empty" id="empty"><div class="orb"><i class="fa-solid fa-plus"></i></div><h2>Add photo or video</h2><p>Drag files here or browse.</p><button class="btn pri" id="pick"><i class="fa-solid fa-plus"></i> Browse files</button><small>Up to 10 files · videos to 3:30</small></div>
      <img id="pimg" alt="" hidden><video id="pvid" playsinline controls hidden></video>
      <div class="shade" id="shade" hidden></div>
      <div class="ptop" id="ptop" hidden><div class="who"><img id="pav" alt=""><span id="pname"></span></div><div style="display:flex;gap:8px;align-items:center"><span class="chip" id="dur" hidden></span><button class="x" id="clear" aria-label="Remove media"><i class="fa-solid fa-xmark"></i></button></div></div>
      <div class="pcap" id="pcap" hidden></div>
      <div class="busy" id="busy" hidden><i class="fa-solid fa-spinner fa-spin"></i> Checking…</div>
     </div>
     <div class="queue" id="queue" hidden></div>
    </div>
    <div>
     <div class="card"><h3>Caption <small>Optional</small></h3><textarea id="cap" maxlength="180" placeholder="Add a caption"></textarea><div class="cnt"><span id="cc">0</span>/180</div></div>
     <div class="card"><h3>Audience</h3><div id="priv"></div></div>
     <button class="btn pri block" id="post" disabled><i class="fa-regular fa-paper-plane"></i> Share status</button>
     <div class="note"><i class="fa-regular fa-clock"></i> Disappears after 24 hours</div>
    </div>
   </div>
   <div class="mine"><h2>Your statuses <span id="count">0</span></h2><div id="list"><div class="none">Loading…</div></div></div>
  </section>
 </main>
</div>
<nav class="mnav" id="mnav"></nav>
<div class="ov modal-overlay" id="ov"><div class="modal"><div class="mh"><span>Status insights</span><button id="ovx" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="tabs"><button class="on" data-t="views"></button><button data-t="likes"></button></div><div class="ml" id="ml"></div></div></div>
<input type="file" id="file" accept="image/*,video/*" multiple hidden>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}};
const jget=k=>{try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==="object"?v:{}}catch(e){return {}}};
const go=u=>location.href=u;
const MAXV=210,MAXQ=10,PRIV=[["contacts","fa-users","My contacts","Anyone in your contacts"],["close","fa-star","Close friends","Selected friends"],["me","fa-lock","Only me","Just you"]];
if(!AlphaCommon.getToken())go("login.html");

/* Appearance from Settings: text size isn't handled by alpha-common, so apply it here and follow changes live */
const applySize=()=>document.documentElement.style.fontSize=ls("alpha_textsize","16")+"px";
applySize();addEventListener("storage",e=>e.key==="alpha_textsize"&&applySize());

const toast=(m,t)=>AlphaCommon.toast(m,t==="error"?"error":undefined);
const api=(p,m="GET",b)=>AlphaCommon.api(p,{method:m,body:b?JSON.stringify(b):undefined});
const upload=f=>{const fd=new FormData();fd.append("file",f);return AlphaCommon.api("/upload",{method:"POST",body:fd,timeout:120000}).then(d=>d.url)};
const avatar=(u,n)=>u&&u.avatar_url||"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#0f766e"/><text x="32" y="42" font-size="26" font-family="Arial" font-weight="700" fill="#fff" text-anchor="middle">${esc((n||"?")[0].toUpperCase())}</text></svg>`);
const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const isVid=u=>/\.(mp4|webm|ogg|mov)(\?|$)/i.test(u||"");

/* nav shell — identical to Settings */
const NAV=[["index.html","fa-house","Home"],["reels.html","fa-film","Reels"],["chat.html","fa-comment-dots","Messages"],["calls.html","fa-phone","Calls"],["events.html","fa-calendar-days","Events"],["vaults.html","fa-shield-halved","Vaults"],["ai.html","fa-wand-magic-sparkles","Alphagram AI"],["status.html","fa-circle-dot","Status"],["saved.html","fa-bookmark","Saved"],["settings.html","fa-gear","Settings"]];
const btn=(u,i,l)=>`<button class="${u==="status.html"?"active on":""}" data-go="${u}"><i class="fa-solid ${i}"></i>${l}</button>`;
$("#side").innerHTML=NAV.map(n=>btn(...n)).join("");
$("#mnav").innerHTML=[NAV[0],NAV[2],NAV[7],NAV[5],NAV[9]].map(n=>btn(...n)).join("");
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");b&&go(b.dataset.go)});

/* state */
let me=null,mine=[],queue=[],idx=0,editing=null,privacy="contacts",busy=false;
$("#priv").innerHTML=PRIV.map(([k,i,n,d])=>`<button class="opt${k===privacy?" on":""}" data-p="${k}"><span class="ic"><i class="fa-solid ${i}"></i></span><div><b>${n}</b><span>${d}</span></div><span class="r"></span></button>`).join("");
$("#priv").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;privacy=b.dataset.p;document.querySelectorAll("#priv .opt").forEach(o=>o.classList.toggle("on",o===b))};

async function boot(){
 const u=AlphaCommon.getUser();
 if(u){me={email:u.email,display_name:u.display_name,avatar_url:u.avatar_url};paintMe()}
 try{
  const v=await api("/verify");me={email:v.email,display_name:v.display_name,avatar_url:me&&me.avatar_url};
  paintMe();
  const [us,all]=await Promise.all([api("/users").catch(()=>[]),loadMine()]);
  const m=(us||[]).find(x=>x.email===me.email);if(m){me.avatar_url=m.avatar_url||null;paintMe()}
 }catch(e){toast(e.message,"error")}
}
function paintMe(){const n=me.display_name||"You",a=avatar(me,n);$("#meAv").src=$("#pav").src=a;$("#meName").textContent=$("#pname").textContent=n}
async function loadMine(){
 try{const all=await api("/status");mine=(all||[]).filter(s=>s.uid===me.email);renderMine()}
 catch(e){$("#list").innerHTML=`<div class="none">Couldn't load your statuses.<br>${esc(e.message)}</div>`}
}

/* media queue */
$("#pick").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=[...e.target.files];e.target.value="";f.length&&addFiles(f)};
const stage=$("#messages");
["dragenter","dragover"].forEach(v=>stage.addEventListener(v,e=>{e.preventDefault();stage.classList.add("drag")}));
["dragleave","drop"].forEach(v=>stage.addEventListener(v,e=>{e.preventDefault();stage.classList.remove("drag")}));
stage.addEventListener("drop",e=>{const f=[...e.dataTransfer.files].filter(x=>/^(image|video)\//.test(x.type));f.length?addFiles(f):toast("Drop photos or videos","error")});

function probe(file){return new Promise(res=>{const url=URL.createObjectURL(file),v=document.createElement("video");v.preload="metadata";
 v.onloadedmetadata=()=>res({url,dur:v.duration});v.onerror=()=>{URL.revokeObjectURL(url);res(null)};v.src=url})}
async function addFiles(files){
 const room=editing?1:MAXQ-queue.length;
 if(room<=0)return toast(`Max ${MAXQ} per batch`);
 if(editing){queue.forEach(q=>URL.revokeObjectURL(q.url));queue=[]}
 $("#busy").hidden=false;let added=0;
 for(const f of files.slice(0,room)){
  if(f.type.startsWith("video/")){
   const p=await probe(f);
   if(!p||!isFinite(p.dur)||p.dur<=0){toast("Couldn't read that video","error");continue}
   if(p.dur>MAXV){URL.revokeObjectURL(p.url);toast(`Video is ${fmt(p.dur)}. Max is 3:30.`,"error");continue}
   queue.push({file:f,url:p.url,dur:p.dur,video:true});
  }else if(f.type.startsWith("image/")){queue.push({file:f,url:URL.createObjectURL(f)})}
  else{toast("Unsupported file type","error");continue}
  added++;
 }
 $("#busy").hidden=true;
 if(files.length>room)toast(`Added ${room}. Max ${MAXQ} per batch`);
 if(added){idx=queue.length-1;show()}
}
function show(){
 const it=queue[idx],url=it?it.url:editing&&editing.url,vid=it?it.video:editing&&isVid(editing.url);
 const has=!!url;$("#messages").classList.toggle("has",has);
 $("#empty").hidden=has;$("#shade").hidden=$("#ptop").hidden=!has;
 $("#pimg").hidden=!has||vid;$("#pvid").hidden=!has||!vid;
 if(has){vid?($("#pvid").src=url):($("#pvid").pause(),$("#pimg").src=url)}else{$("#pvid").pause();$("#pvid").removeAttribute("src");$("#pimg").removeAttribute("src")}
 const d=it&&it.dur;$("#dur").hidden=!d;d&&($("#dur").innerHTML=`<i class="fa-solid fa-video"></i> ${fmt(d)}`);
 queueUI();label();
}
function queueUI(){
 const q=$("#queue");if(queue.length<2){q.hidden=true;q.innerHTML="";return}
 q.hidden=false;
 q.innerHTML=queue.map((it,i)=>`<div class="qt${i===idx?" on":""}" data-i="${i}">${it.video?`<video src="${it.url}" muted preload="metadata"></video>`:`<img src="${it.url}" alt="">`}<button data-rm="${i}" aria-label="Remove"><i class="fa-solid fa-xmark"></i></button></div>`).join("")+(queue.length<MAXQ?'<button class="qa" id="qadd" aria-label="Add more"><i class="fa-solid fa-plus"></i></button>':"");
}
$("#queue").onclick=e=>{
 if(e.target.closest("#qadd"))return $("#file").click();
 const r=e.target.closest("[data-rm]");if(r){const i=+r.dataset.rm;URL.revokeObjectURL(queue[i].url);queue.splice(i,1);idx=Math.min(idx,queue.length-1);return queue.length?show():clearAll()}
 const t=e.target.closest("[data-i]");t&&(idx=+t.dataset.i,show());
};
$("#clear").onclick=()=>clearAll();
function clearAll(keepEdit){
 queue.forEach(q=>URL.revokeObjectURL(q.url));queue=[];idx=0;
 if(!keepEdit)editing=null;show();
}
function label(){
 const n=queue.length,has=n||editing||$("#cap").value.trim();
 $("#post").disabled=busy||!has;
 $("#post").innerHTML=editing?'<i class="fa-regular fa-pen-to-square"></i> Update status':n>1?`<i class="fa-regular fa-paper-plane"></i> Share ${n} statuses`:'<i class="fa-regular fa-paper-plane"></i> Share status';
}
$("#cap").oninput=()=>{const v=$("#cap").value;$("#cc").textContent=v.length;$("#pcap").textContent=v;$("#pcap").hidden=!v.trim();label()};

/* publish / update */
$("#post").onclick=async()=>{
 if(busy||!me)return;const caption=$("#cap").value.trim();
 if(!editing&&!queue.length&&!caption)return toast("Add a photo, a video or a caption");
 busy=true;label();const b=$("#post");let ok=0;
 const items=queue.length?queue:[null],total=items.length;
 try{
  for(let i=0;i<total;i++){
   b.innerHTML=`<i class="fa-solid fa-spinner fa-spin"></i> ${editing?"Saving…":`Publishing ${i+1}/${total}…`}`;
   try{
    let url=null;
    if(items[i]){let f=items[i].file;if(!items[i].video&&AlphaCommon.compressImage)f=await AlphaCommon.compressImage(f,1600,.8);url=await upload(f)}
    if(editing)await api("/status/"+editing.id,"PUT",{text:caption,image_url:url||editing.url||null,text_color:"white",background:"default",wallpaper:"none"});
    else await api("/status","POST",{text:caption,image_url:url,uid:me.email,author:me.display_name,privacy,expires_at:new Date(Date.now()+864e5).toISOString(),text_color:"white",background:"default",wallpaper:"none"});
    ok++;
   }catch(e){toast(`${total>1?"Item "+(i+1)+" failed: ":""}${e.message}`,"error")}
  }
 }finally{busy=false}
 if(ok){toast(editing?"Status updated":ok>1?`${ok}/${total} statuses published`:"Posted");editing=null;clearAll();$("#cap").value="";$("#cap").oninput();loadMine()}
 label();
};

/* my statuses */
function renderMine(){
 $("#count").textContent=mine.length;
 if(!mine.length){$("#list").innerHTML='<div class="none"><i class="fa-regular fa-face-smile"></i> No statuses yet.</div>';return}
 const V=jget("alpha_story_views"),L=jget("alpha_story_likes");
 $("#list").innerHTML=mine.map(s=>{
  const u=s.image_url&&s.image_url.trim(),th=u?(isVid(u)?`<video src="${esc(u)}" muted playsinline preload="none"></video><i class="fa-solid fa-play pl"></i>`:`<img src="${esc(u)}" alt="" loading="lazy" decoding="async">`):'<i class="fa-regular fa-file-lines"></i>';
  const views=(V[s.id]||[]).length||(s.views?s.views.length:0),likes=(L[s.id]||[]).length;
  return `<div class="sc" data-id="${esc(s.id)}"><div class="th">${th}</div><div class="si"><b>${esc(s.text||"No caption")}</b><span><span>${new Date(s.created_at).toLocaleString()}</span><span><i class="fa-regular fa-eye"></i> ${views}</span><span style="color:var(--danger)"><i class="fa-solid fa-heart"></i> ${likes}</span></span></div><div class="sa"><button data-a="ins" title="Views and likes"><i class="fa-regular fa-chart-bar"></i></button><button data-a="edit" title="Edit"><i class="fa-regular fa-pen-to-square"></i></button><button class="del" data-a="del" title="Delete"><i class="fa-regular fa-trash-can"></i></button></div></div>`}).join("");
}
$("#list").onclick=async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const id=b.closest(".sc").dataset.id,s=mine.find(x=>String(x.id)===id);if(!s)return;
 if(b.dataset.a==="ins")insights(id);
 if(b.dataset.a==="edit"){clearAll();editing={id:s.id,url:(s.image_url||"").trim()||null};$("#cap").value=s.text||"";$("#cap").oninput();show();toast("Editing status");scrollTo({top:0,behavior:"smooth"})}
 if(b.dataset.a==="del"){if(!await AlphaCommon.confirm({title:"Delete status?",ok:"Delete",danger:true}))return;try{await api("/status/"+id,"DELETE");mine=mine.filter(x=>String(x.id)!==id);renderMine();toast("Status deleted")}catch(er){toast("Delete failed: "+er.message,"error")}}
};
function insights(id){
 const V=jget("alpha_story_views")[id]||[],L=jget("alpha_story_likes")[id]||[],liked=new Set(L.map(v=>v.uid));
 const rows=(l,t)=>l.length?l.slice().reverse().map(v=>`<div class="ir"><img src="${esc(avatar({avatar_url:v.avatar},v.name))}" alt=""><b>${esc(v.name||"User")}</b>${liked.has(v.uid)?'<i class="fa-solid fa-heart" style="color:var(--danger)"></i>':""}<small>${v.time?new Date(v.time).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):""}</small></div>`).join(""):`<div class="none" style="border:0">${t}</div>`;
 const t=document.querySelectorAll(".tabs button");t[0].innerHTML=`<i class="fa-regular fa-eye"></i> Viewed by ${V.length}`;t[1].innerHTML=`<i class="fa-solid fa-heart"></i> Liked by ${L.length}`;
 const set=k=>{t.forEach(b=>b.classList.toggle("on",b.dataset.t===k));$("#ml").innerHTML=k==="views"?rows(V,"No views yet."):rows(L,"No likes yet.")};
 t.forEach(b=>b.onclick=()=>set(b.dataset.t));set("views");$("#ov").classList.add("show");
}
$("#ovx").onclick=()=>$("#ov").classList.remove("show");
$("#ov").onclick=e=>e.target.id==="ov"&&$("#ov").classList.remove("show");
addEventListener("keydown",e=>e.key==="Escape"&&$("#ov").classList.remove("show"));
addEventListener("beforeunload",e=>{if(queue.length||$("#cap").value.trim()){e.preventDefault();e.returnValue=""}});
boot();
</script>
</body>
