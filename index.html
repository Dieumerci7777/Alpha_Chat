<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha — Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #3366ff;
      --blue-light: #5c85ff;
      --cyan: #21d4fd;
      --bg: #f5f7fb;
      --text: #111827;
      --muted: #667085;
      --border: #e4e8f0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(51,102,255,.13), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(33,212,253,.12), transparent 30%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .page {
      width: min(1080px, 100%);
      min-height: 650px;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      overflow: hidden;
      border-radius: 32px;
      background: rgba(255,255,255,.8);
      border: 1px solid rgba(255,255,255,.9);
      backdrop-filter: blur(25px);
      box-shadow: 0 30px 80px rgba(25,45,90,.13);
    }

    /* LEFT SIDE */

    .showcase {
      position: relative;
      padding: 58px;
      overflow: hidden;
      color: white;
      background: linear-gradient(145deg, #1d49d8, #3366ff 55%, #21a8e8);
    }

    .showcase::before,
    .showcase::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.09);
    }

    .showcase::before {
      width: 360px;
      height: 360px;
      right: -150px;
      top: -120px;
    }

    .showcase::after {
      width: 300px;
      height: 300px;
      left: -170px;
      bottom: -130px;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.28);
      font-size: 21px;
      font-weight: 800;
    }

    .brand strong {
      font-size: 22px;
      letter-spacing: -.5px;
    }

    .hero {
      position: relative;
      z-index: 1;
      margin-top: 115px;
      max-width: 470px;
    }

    .hero h1 {
      font-size: clamp(40px, 5vw, 62px);
      line-height: .98;
      letter-spacing: -3px;
    }

    .hero h1 span {
      color: #bff4ff;
    }

    .hero p {
      margin-top: 22px;
      max-width: 420px;
      color: rgba(255,255,255,.78);
      line-height: 1.7;
      font-size: 15px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .pill {
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      font-size: 12px;
      font-weight: 600;
    }

    /* LOGIN */

    .login-side {
      display: grid;
      place-items: center;
      padding: 54px;
      background: rgba(255,255,255,.72);
    }

    .card {
      width: min(390px, 100%);
    }

    .mobile-brand {
      display: none;
    }

    .heading h2 {
      font-size: 31px;
      letter-spacing: -1.3px;
    }

    .heading p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    form {
      margin-top: 32px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #344054;
    }

    .input-wrap {
      position: relative;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 54px;
      padding: 0 48px 0 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      transition: .2s;
    }

    input:focus {
      border-color: var(--blue-light);
      box-shadow: 0 0 0 4px rgba(51,102,255,.1);
    }

    .toggle {
      position: absolute;
      right: 8px;
      top: 7px;
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      color: #98a2b3;
      cursor: pointer;
      border-radius: 10px;
    }

    .toggle:hover {
      background: #f2f4f7;
      color: var(--blue);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 24px;
      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      cursor: pointer;
    }

    .remember input {
      accent-color: var(--blue);
    }

    a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--blue), #4d7cff);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 12px 25px rgba(51,102,255,.24);
      transition: .2s;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(51,102,255,.3);
    }

    .btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
    }

    .loading .spinner {
      display: inline-block;
      animation: spin .7s linear infinite;
    }

    .loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      min-height: 0;
      margin-top: 14px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.5;
    }

    .message.error,
    .message.success {
      padding: 11px 13px;
    }

    .message.error {
      color: #b42318;
      background: #fef3f2;
      border: 1px solid #fecdca;
    }

    .message.success {
      color: #067647;
      background: #ecfdf3;
      border: 1px solid #abefc6;
    }

    .register {
      margin-top: 26px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 820px) {
      body {
        padding: 12px;
      }

      .page {
        min-height: auto;
        grid-template-columns: 1fr;
        max-width: 520px;
        border-radius: 24px;
      }

      .showcase {
        display: none;
      }

      .login-side {
        padding: 42px 26px;
      }

      .mobile-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 34px;
      }

      .mobile-brand .logo {
        color: white;
        background: linear-gradient(135deg, var(--blue), var(--cyan));
      }

      .mobile-brand strong {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="showcase">

      <div class="brand">
        <div class="logo">A</div>
        <strong>ALPHA</strong>
      </div>

      <div class="hero">
        <h1>
          Your world.<br>
          Your people.<br>
          <span>Your Alpha.</span>
        </h1>

        <p>
          Connect, share, discover and manage your digital life
          from one beautifully connected platform.
        </p>

        <div class="pills">
          <span class="pill">
            <i class="fa-solid fa-globe"></i> Social
          </span>

          <span class="pill">
            <i class="fa-solid fa-lock"></i> Private Vaults
          </span>

          <span class="pill">
            <i class="fa-solid fa-robot"></i> AI
          </span>

          <span class="pill">
            <i class="fa-solid fa-calendar"></i> Events
          </span>
        </div>
      </div>

    </section>


    <section class="login-side">

      <div class="card">

        <div class="mobile-brand">
          <div class="logo">A</div>
          <strong>ALPHA</strong>
        </div>

        <div class="heading">
          <h2>Welcome back</h2>
          <p>Sign in to continue to your Alpha account.</p>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm" novalidate>

          <div class="field">
            <label for="email">Email address</label>

            <div class="input-wrap">
              <input
                id="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="username"
                required
              >
            </div>
          </div>


          <div class="field">

            <label for="password">Password</label>

            <div class="input-wrap">

              <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >

              <button
                class="toggle"
                id="passwordToggle"
                type="button"
                aria-label="Show password"
              >
                <i class="fa-solid fa-eye"></i>
              </button>

            </div>

          </div>


          <div class="options">

            <label class="remember">
              <input id="remember" type="checkbox">
              Remember me
            </label>

            <a href="#" id="forgotLink">
              Forgot password?
            </a>

          </div>


          <button class="btn" id="loginButton" type="submit">

            <span class="btn-text">
              Sign in
            </span>

            <i class="fa-solid fa-spinner spinner"></i>

          </button>

        </form>


        <div class="register">
          Don't have an account?
          <a href="register.html">Create account</a>
        </div>

      </div>

    </section>

  </main>


  <script>
    const API_BASE =
      'https://alpha-auth.murwanashyakadieumerci540.workers.dev';

    const TOKEN_KEY = 'alpha_token';
    const USER_KEY = 'alpha_user';

    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const remember = document.getElementById('remember');
    const button = document.getElementById('loginButton');
    const message = document.getElementById('message');
    const toggle = document.getElementById('passwordToggle');


    /* Existing session */

    if (
      localStorage.getItem(TOKEN_KEY) &&
      localStorage.getItem(USER_KEY)
    ) {
      location.href = 'Shell.html';
    }


    /* Remember email */

    const savedEmail =
      localStorage.getItem('alphaRemember');

    if (savedEmail) {
      email.value = savedEmail;
      remember.checked = true;
    }


    /* Messages */

    function showMessage(text, type = '') {
      message.textContent = text;
      message.className = `message ${type}`;
    }


    /* Show / hide password */

    toggle.addEventListener('click', () => {

      const visible = password.type === 'text';

      password.type =
        visible ? 'password' : 'text';

      toggle.innerHTML =
        `<i class="fa-solid ${
          visible ? 'fa-eye' : 'fa-eye-slash'
        }"></i>`;
    });


    /* Forgot password */

    document
      .getElementById('forgotLink')
      .addEventListener('click', (e) => {

        e.preventDefault();

        showMessage(
          'Password reset is not configured yet. Please contact support.',
          'success'
        );
      });


    /* Login API */

    async function login(emailValue, passwordValue) {

      const response = await fetch(
        `${API_BASE}/login`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: emailValue,
            password: passwordValue
          })
        }
      );

      let data = null;

      try {
        data = await response.json();
      } catch {}

      if (!response.ok) {
        throw new Error(
          data?.error ||
          'Invalid credentials. Please try again.'
        );
      }

      return data;
    }


    /* Submit */

    form.addEventListener('submit', async (e) => {

      e.preventDefault();

      const emailValue =
        email.value.trim();

      const passwordValue =
        password.value;


      if (!emailValue) {
        showMessage(
          'Please enter your email address.',
          'error'
        );
        return;
      }


      if (passwordValue.length < 6) {
        showMessage(
          'Password must be at least 6 characters.',
          'error'
        );
        return;
      }


      button.disabled = true;
      button.classList.add('loading');

      showMessage();


      try {

        const data =
          await login(
            emailValue,
            passwordValue
          );


        /* Save token */

        localStorage.setItem(
          TOKEN_KEY,
          data.token
        );


        /* Save user */

        const user =
          data.user || data;

        localStorage.setItem(
          USER_KEY,
          JSON.stringify({

            CU: {
              id: user.email || emailValue,
              email: user.email || emailValue
            },

            UP: {
              display_name:
                user.display_name ||
                user.name ||
                emailValue.split('@')[0],

              bio:
                user.bio || '',

              avatar_color:
                user.avatar_color || 'g2',

              avatar_url:
                user.avatar_url || null
            }

          })
        );


        /* Remember me */

        if (remember.checked) {

          localStorage.setItem(
            'alphaRemember',
            emailValue
          );

        } else {

          localStorage.removeItem(
            'alphaRemember'
          );

        }


        showMessage(
          'Welcome back! Redirecting…',
          'success'
        );


        setTimeout(() => {

          location.href = 'Shell.html';

        }, 500);


      } catch (error) {

        showMessage(
          error.message,
          'error'
        );

        button.disabled = false;
        button.classList.remove('loading');
      }

    });
  </script>

</body>
</html>
