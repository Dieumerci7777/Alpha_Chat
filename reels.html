<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Alpha Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="alpha-common.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           ALPHA REELS — MOBILE-FIRST SOCIAL VIDEO EXPERIENCE
           ========================================================= */
        :root {
            --alpha: #3366FF;
            --alpha2: #5C85FF;
            --white: #fff;
            --black: #000;
            --danger: #ff3040;
            --glass: rgba(18, 18, 18, .48);
            --glass-heavy: rgba(15, 15, 15, .88);
            --line: rgba(255, 255, 255, .14);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --theater-bg-0: #050608;
            --theater-bg-1: #0c0e14;
            --panel: rgba(255, 255, 255, .05);
            --panel-line: rgba(255, 255, 255, .09);
            --rail-w: 72px;
            --strip-w: 88px;
            --console-w: calc(var(--rail-w) + var(--strip-w));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }
        button {
            cursor: pointer;
        }

        /* =========================================================
           APP
           ========================================================= */
        .app {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #000;
        }

        /* =========================================================
           REEL FEED
           ========================================================= */
        .reel-feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            overscroll-behavior-y: contain;
            background: #000;
        }
        .reel-feed::-webkit-scrollbar {
            display: none;
        }

        /* =========================================================
           REEL
           ========================================================= */
        .reel {
            position: relative;
            width: 100%;
            height: 100dvh;
            min-height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow: hidden;
            background: #080808;
        }
        .reel-stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080808;
        }
        .reel-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #080808;
            user-select: none;
            -webkit-user-select: none;
        }
        .reel-gradient {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom,
                    rgba(0, 0, 0, .58) 0%,
                    rgba(0, 0, 0, .12) 20%,
                    transparent 48%,
                    rgba(0, 0, 0, .08) 62%,
                    rgba(0, 0, 0, .82) 100%);
        }

        /* =========================================================
           TOP HEADER
           ========================================================= */
        .top-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: calc(72px + var(--safe-top));
            padding: calc(12px + var(--safe-top)) 14px 8px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: none;
            font-family: "Sora", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 19px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: -.4px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .6);
            white-space: nowrap;
        }
        .logo span {
            color: var(--alpha2);
        }

        /* =========================================================
           MOBILE TOP CENTER
           ========================================================= */
        .feed-switcher {
            position: absolute;
            left: 50%;
            top: calc(12px + var(--safe-top));
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            padding: 3px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, .36);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 30px;
            z-index: 31;
        }
        .feed-switcher button {
            border: 0;
            color: rgba(255, 255, 255, .65);
            background: transparent;
            padding: 8px 12px;
            border-radius: 22px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }
        .feed-switcher button.active {
            color: #fff;
            background: rgba(255, 255, 255, .16);
        }

        /* =========================================================
           SEARCH BUTTON
           ========================================================= */
        .search-button {
            width: 43px;
            height: 43px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, .42);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            position: absolute;
            right: 14px;
            top: calc(12px + var(--safe-top));
            z-index: 50;
            transition: transform .15s, background .15s;
        }
        .search-button:hover {
            background: rgba(255, 255, 255, .1);
        }
        .search-button:active {
            transform: scale(.92);
        }

        /* =========================================================
           SEARCH SCREEN
           ========================================================= */
        .search-screen {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: #050505;
            transform: translateY(-100%);
            transition: transform .32s cubic-bezier(.2, .8, .2, 1);
            padding: calc(12px + var(--safe-top)) 15px calc(20px + var(--safe-bottom));
            display: flex;
            flex-direction: column;
        }
        .search-screen.open {
            transform: translateY(0);
        }
        .search-top {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 54px;
        }
        .close-search {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 50%;
            background: #191919;
            color: #fff;
            font-size: 22px;
        }
        .search-field {
            flex: 1;
            height: 44px;
            border-radius: 23px;
            border: 1px solid #333;
            background: #181818;
            color: #fff;
            outline: none;
            padding: 0 17px;
            font-size: 14px;
        }
        .search-field:focus {
            border-color: var(--alpha);
        }
        .search-results-title {
            margin-top: 28px;
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 800;
            color: #aaa;
        }
        .search-results {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: auto;
        }
        .search-result {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 6px;
            border-radius: 14px;
        }
        .search-result:active {
            background: #171717;
        }
        .search-result img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
        }
        .search-result-info {
            min-width: 0;
        }
        .search-result-name {
            font-size: 14px;
            font-weight: 800;
        }
        .search-result-meta {
            color: #777;
            font-size: 12px;
            margin-top: 3px;
        }
        .search-empty {
            color: #666;
            font-size: 13px;
            text-align: center;
            padding: 30px 10px;
        }

        /* =========================================================
           RIGHT ACTIONS
           ========================================================= */
        .actions {
            position: absolute;
            right: 9px;
            bottom: calc(122px + var(--safe-bottom));
            z-index: 35;
            width: 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .action {
            width: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .action-button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(0, 0, 0, .38);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #fff;
            font-size: 21px;
            transition: transform .18s;
        }
        .action-button:active {
            transform: scale(.84);
        }
        .action-count {
            font-size: 10px;
            font-weight: 800;
            text-shadow: 0 2px 6px #000;
        }
        .like-action.liked .action-button {
            color: var(--danger);
        }
        .like-action.liked .action-button {
            animation: like .28s ease;
        }
        .save-action.saved .action-button {
            color: var(--alpha2);
        }
        @keyframes like {
            50% {
                transform: scale(1.3);
            }
        }

        /* =========================================================
           PLAY BUTTON
           ========================================================= */
        .play-indicator {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(.75);
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            transition: .2s;
        }
        .reel.paused .play-indicator {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* =========================================================
           DOUBLE TAP HEART
           ========================================================= */
        .big-heart {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(.2);
            opacity: 0;
            z-index: 45;
            pointer-events: none;
            font-size: 105px;
        }
        .big-heart.show {
            animation: heartPop .75s ease forwards;
        }
        @keyframes heartPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.2);
            }
            25% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.25);
            }
            55% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.4);
            }
        }

        /* =========================================================
           BOTTOM INFORMATION
           ========================================================= */
        .reel-info {
            position: absolute;
            left: 14px;
            right: 72px;
            bottom: calc(25px + var(--safe-bottom));
            z-index: 35;
            color: #fff;
        }
        .creator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            min-width: 0;
        }
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            flex-shrink: 0;
            background: #222;
        }
        .creator-name {
            min-width: 0;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 850;
        }
        .verified {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1887f2;
            font-size: 8px;
            margin-left: 2px;
        }
        .follow {
            padding: 6px 11px;
            border: 1px solid rgba(255, 255, 255, .6);
            border-radius: 20px;
            background: rgba(255, 255, 255, .08);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }
        .follow.following {
            color: #111;
            background: #fff;
            border-color: #fff;
        }
        .caption {
            font-size: 13px;
            line-height: 1.38;
            max-width: 100%;
            margin-bottom: 7px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .hashtags {
            color: #72b8ff;
        }
        .audio {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .audio-icon {
            font-size: 12px;
        }

        /* =========================================================
           PROGRESS
           ========================================================= */
        .progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            z-index: 80;
            background: rgba(255, 255, 255, .16);
        }
        .progress-bar {
            width: 0;
            height: 100%;
            background: #fff;
        }

        /* =========================================================
           STATE SCREEN (loading / empty / error)
           ========================================================= */
        .state-screen {
            height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: rgba(255, 255, 255, .55);
            text-align: center;
            padding: 0 30px;
        }
        .state-screen .mark {
            font-size: 34px;
            font-weight: 900;
            color: var(--alpha2);
        }
        .state-screen p {
            font-size: 13px;
            max-width: 260px;
            line-height: 1.6;
        }
        .state-screen button {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .08);
            color: #fff;
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
        }

        /* =========================================================
           MOBILE BOTTOM NAVIGATION
           ========================================================= */
        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: calc(61px + var(--safe-bottom));
            padding: 5px 8px calc(5px + var(--safe-bottom));
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background: linear-gradient(to top, rgba(0, 0, 0, .92), rgba(0, 0, 0, .55), transparent);
            pointer-events: none;
        }
        .bottom-nav-item {
            border: 0;
            background: transparent;
            color: rgba(255, 255, 255, .62);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 10px;
            font-weight: 700;
            pointer-events: auto;
        }
        .bottom-nav-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }
        .bottom-nav-item.active {
            color: #fff;
        }
        .bottom-nav-item.active .bottom-nav-icon {
            color: var(--alpha2);
        }
        .create-nav .bottom-nav-icon {
            width: 40px;
            height: 30px;
            border-radius: 10px;
            background: #fff;
            color: #111;
            font-size: 22px;
        }

        /* =========================================================
           COMMENTS BOTTOM SHEET
           ========================================================= */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, .55);
            opacity: 0;
            visibility: hidden;
            transition: .25s;
        }
        .sheet-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .comments-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: min(78dvh, 680px);
            z-index: 310;
            background: #111;
            border-radius: 22px 22px 0 0;
            transform: translateY(100%);
            transition: transform .32s cubic-bezier(.2, .8, .2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sheet-overlay.open .comments-sheet {
            transform: translateY(0);
        }
        .sheet-handle {
            width: 38px;
            height: 4px;
            border-radius: 10px;
            background: #555;
            margin: 9px auto 4px;
        }
        .sheet-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #292929;
            flex-shrink: 0;
            position: relative;
        }
        .sheet-title {
            font-size: 15px;
            font-weight: 850;
        }
        .sheet-close {
            position: absolute;
            right: 15px;
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 50%;
            color: #fff;
            background: #222;
            font-size: 20px;
        }
        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .comment {
            display: flex;
            gap: 10px;
            margin-bottom: 19px;
        }
        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #222;
        }
        .comment-user {
            font-size: 12px;
            font-weight: 850;
            margin-bottom: 3px;
        }
        .comment-text {
            font-size: 13px;
            color: #ddd;
            line-height: 1.4;
            word-break: break-word;
        }
        .comment-time {
            color: #777;
            font-size: 10px;
            margin-top: 4px;
        }
        .comment-empty {
            color: #666;
            font-size: 13px;
            text-align: center;
            padding: 30px 10px;
        }
        .comment-form {
            display: flex;
            gap: 8px;
            padding: 10px 12px calc(10px + var(--safe-bottom));
            border-top: 1px solid #292929;
            background: #111;
        }
        .comment-input {
            flex: 1;
            height: 44px;
            min-width: 0;
            border-radius: 23px;
            border: 1px solid #333;
            outline: none;
            background: #202020;
            color: #fff;
            padding: 0 15px;
            font-size: 13px;
        }
        .comment-send {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border: 0;
            border-radius: 50%;
            background: var(--alpha);
            color: #fff;
        }

        /* =========================================================
           SHARE SHEET
           ========================================================= */
        .share-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 410;
            background: #171717;
            border-radius: 22px 22px 0 0;
            padding: 12px 18px calc(20px + var(--safe-bottom));
            transform: translateY(100%);
            transition: transform .32s cubic-bezier(.2, .8, .2, 1);
        }
        .sheet-overlay.share-open .share-sheet {
            transform: translateY(0);
        }
        .share-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 18px;
        }
        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            color: #ddd;
            font-size: 10px;
        }
        .share-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #252525;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* =========================================================
           UPLOAD SHEET
           ========================================================= */
        .upload-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 420;
            background: #171717;
            border-radius: 22px 22px 0 0;
            padding: 16px 18px calc(20px + var(--safe-bottom));
            transform: translateY(100%);
            transition: transform .32s cubic-bezier(.2, .8, .2, 1);
        }
        .sheet-overlay.upload-open .upload-sheet {
            transform: translateY(0);
        }
        .upload-sheet h3 {
            font-size: 16px;
            font-weight: 850;
            margin-bottom: 4px;
        }
        .upload-drop {
            border: 1.5px dashed rgba(255, 255, 255, .2);
            border-radius: 16px;
            padding: 22px;
            text-align: center;
            color: rgba(255, 255, 255, .55);
            font-size: 12.5px;
            margin-top: 14px;
        }
        .upload-drop.has-file {
            border-color: var(--alpha2);
            color: var(--alpha2);
        }
        .upload-caption {
            width: 100%;
            margin-top: 14px;
            min-height: 70px;
            resize: none;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 14px;
            background: #202020;
            color: #fff;
            padding: 12px;
            font-size: 13px;
            outline: 0;
        }
        .upload-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .upload-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: 0;
            font-weight: 800;
            font-size: 12px;
        }
        .upload-cancel {
            background: #252525;
            color: #ddd;
        }
        .upload-submit {
            background: var(--alpha);
            color: #fff;
        }
        .upload-submit:disabled {
            opacity: .45;
        }

        /* =========================================================
           TOAST
           ========================================================= */
        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(84px + var(--safe-bottom));
            transform: translateX(-50%) translateY(15px);
            z-index: 700;
            padding: 10px 17px;
            border-radius: 22px;
            background: rgba(20, 20, 20, .9);
            border: 1px solid #333;
            backdrop-filter: blur(15px);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            visibility: hidden;
            transition: .22s;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* =========================================================
           DESKTOP-ONLY CHROME (rail / filmstrip / stage nav)
           Hidden by default; switched on inside the 900px theater
           media query below so phones and tablets never pay for it.
           ========================================================= */
        .desktop-rail,
        .reel-strip,
        .stage-nav {
            display: none;
        }

        /* =========================================================
           TABLETS
           ========================================================= */
        @media (min-width: 600px) and (max-width: 899px) {
            .logo {
                display: block;
                position: absolute;
                left: 18px;
                top: calc(20px + var(--safe-top));
            }
            .reel-info {
                left: 24px;
                right: 100px;
            }
            .actions {
                right: 18px;
            }
            .bottom-nav {
                max-width: 520px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                border-radius: 22px 22px 0 0;
                background: rgba(10, 10, 10, .82);
                backdrop-filter: blur(18px);
            }
        }

        /* =========================================================
           DESKTOP CONSOLE
           ========================================================= */
        @media (min-width: 900px) {
            html,
            body {
                background: var(--theater-bg-0);
            }
            .app {
                background: radial-gradient(ellipse 1000px 760px at 62% 32%, var(--theater-bg-1), var(--theater-bg-0) 70%);
            }
            .reel-feed {
                background: transparent;
                left: var(--console-w);
            }
            .reel {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 26px;
                background: transparent;
                padding: 0 104px 0 32px;
            }
            .reel-stage {
                position: relative;
                inset: auto;
                flex-shrink: 0;
                width: min(28vw, 380px);
                height: min(82dvh, 740px);
                aspect-ratio: 9/16;
                border-radius: 20px;
                box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .8), 0 0 0 1px var(--panel-line), 0 0 0 5px rgba(9, 10, 14, .6);
            }
            .reel-video,
            .reel-gradient {
                border-radius: 20px;
            }
            .reel.paused .play-indicator {
                transform: translate(-50%, -50%) scale(.9);
            }
            .progress {
                left: 14px;
                right: 14px;
                bottom: 12px;
                height: 3px;
                border-radius: 3px;
                background: rgba(255, 255, 255, .22);
            }
            .progress-bar {
                border-radius: 3px;
                background: linear-gradient(90deg, var(--alpha), var(--alpha2));
            }
            /* Sound button removed from stage, handled by actions */

            /* ---------------------------------------------------
               ENGAGEMENT CONSOLE
               --------------------------------------------------- */
            .reel-side {
                display: flex;
                flex-direction: column;
                width: 296px;
                flex-shrink: 0;
                border-radius: 18px;
                background: linear-gradient(165deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .03) 40%), var(--panel);
                border: 1px solid var(--panel-line);
                box-shadow: 0 24px 60px -30px rgba(0, 0, 0, .85);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                overflow: hidden;
            }
            .reel-info,
            .actions {
                position: static;
                width: auto;
                z-index: auto;
                border-radius: 0;
                border: 0;
                background: transparent;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .reel-info {
                left: auto;
                right: auto;
                bottom: auto;
                padding: 22px 22px 18px;
            }
            .reel-info::before {
                content: "Now playing";
                display: block;
                margin-bottom: 14px;
                font-family: "Sora", sans-serif;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: .16em;
                text-transform: uppercase;
                color: var(--alpha2);
            }
            .creator {
                margin-bottom: 12px;
            }
            .avatar {
                width: 42px;
                height: 42px;
            }
            .creator-name {
                max-width: none;
                font-family: "Sora", sans-serif;
                font-size: 14.5px;
                letter-spacing: -.1px;
            }
            .follow {
                margin-left: auto;
                padding: 7px 14px;
                font-size: 11px;
                transition: background .15s, color .15s, border-color .15s;
            }
            .follow:hover {
                background: var(--alpha);
                border-color: var(--alpha);
            }
            .caption {
                font-size: 14px;
                color: rgba(255, 255, 255, .92);
            }
            .audio {
                color: rgba(255, 255, 255, .55);
                padding-top: 10px;
                margin-top: 2px;
                border-top: 1px dashed var(--panel-line);
            }
            .actions {
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                /* Added one more for sound */
                gap: 6px;
                padding: 16px 14px;
                border-top: 1px solid var(--panel-line);
                background: rgba(0, 0, 0, .16) !important;
            }
            .action {
                width: auto;
                flex-direction: column;
                gap: 7px;
            }
            .action-button {
                width: 40px;
                height: 40px;
                margin: 0 auto;
                font-size: 17px;
                background: rgba(255, 255, 255, .05);
                border-color: var(--panel-line);
                transition: background .15s, transform .15s, border-color .15s;
            }
            .action-button:hover {
                background: rgba(255, 255, 255, .14);
                border-color: rgba(255, 255, 255, .28);
                transform: translateY(-2px);
            }
            .action-count {
                font-size: 10.5px;
                font-weight: 700;
                color: rgba(255, 255, 255, .55);
                text-shadow: none;
                text-align: center;
            }

            /* ---------------------------------------------------
               APP RAIL
               --------------------------------------------------- */
            .desktop-rail {
                display: flex;
                flex-direction: column;
                align-items: center;
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: var(--rail-w);
                padding: calc(18px + var(--safe-top)) 0 calc(16px + var(--safe-bottom));
                background: rgba(6, 7, 10, .7);
                border-right: 1px solid var(--panel-line);
                z-index: 60;
            }
            .rail-mark {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 38px;
                height: 38px;
                margin-bottom: 30px;
                border-radius: 11px;
                background: linear-gradient(155deg, var(--alpha), #1c3fc9);
                font-family: "Sora", sans-serif;
                font-weight: 800;
                font-size: 17px;
                box-shadow: 0 8px 20px -6px rgba(51, 102, 255, .65);
            }
            .rail-items {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }
            .rail-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                width: 56px;
                padding: 9px 0;
                border: 0;
                border-radius: 12px;
                background: transparent;
                color: rgba(255, 255, 255, .5);
                font-size: 9.5px;
                font-weight: 700;
                transition: background .15s, color .15s;
            }
            .rail-item span {
                font-size: 19px;
            }
            .rail-item:hover {
                background: rgba(255, 255, 255, .06);
                color: rgba(255, 255, 255, .85);
            }
            .rail-item.active {
                color: #fff;
                background: rgba(51, 102, 255, .16);
            }
            .rail-item.active span {
                color: var(--alpha2);
            }
            .rail-create span {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 32px;
                height: 26px;
                border-radius: 8px;
                background: #fff;
                color: #111;
                font-size: 17px;
            }
            .rail-spacer {
                flex: 1;
            }

            /* ---------------------------------------------------
               FILMSTRIP
               --------------------------------------------------- */
            .reel-strip {
                display: flex;
                flex-direction: column;
                align-items: center;
                position: fixed;
                left: var(--rail-w);
                top: calc(68px + var(--safe-top));
                bottom: 0;
                width: var(--strip-w);
                padding: 22px 0 24px;
                overflow-y: auto;
                scrollbar-width: none;
                background: rgba(6, 7, 10, .4);
                border-right: 1px solid var(--panel-line);
                z-index: 55;
            }
            .reel-strip::-webkit-scrollbar {
                display: none;
            }
            .reel-strip-track {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                padding-top: 2px;
            }
            .reel-strip-track::before {
                content: "";
                position: absolute;
                left: 50%;
                top: 4px;
                bottom: 4px;
                width: 2px;
                transform: translateX(-50%);
                background: linear-gradient(to bottom, transparent, var(--panel-line) 12%, var(--panel-line) 88%, transparent);
                z-index: 0;
            }
            .reel-strip-item {
                position: relative;
                z-index: 1;
                width: 40px;
                height: 40px;
                flex-shrink: 0;
                border-radius: 50%;
                border: 2px solid rgba(0, 0, 0, .5);
                overflow: hidden;
                background: #161616;
                opacity: .45;
                transition: opacity .18s, transform .18s, border-color .18s, box-shadow .18s;
            }
            .reel-strip-item img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .reel-strip-item:hover {
                opacity: .85;
                transform: scale(1.08);
            }
            .reel-strip-item.active {
                opacity: 1;
                transform: scale(1.18);
                border-color: var(--alpha2);
                box-shadow: 0 0 0 4px rgba(51, 102, 255, .18);
            }

            /* ---------------------------------------------------
               STAGE NAV
               --------------------------------------------------- */
            .stage-nav {
                display: flex;
                flex-direction: column;
                align-items: center;
                position: fixed;
                right: 26px;
                top: 50%;
                transform: translateY(-50%);
                gap: 14px;
                z-index: 58;
            }
            .stage-nav button {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: 1px solid var(--panel-line);
                background: rgba(255, 255, 255, .05);
                color: #fff;
                font-size: 15px;
                transition: background .15s, transform .15s, opacity .15s;
            }
            .stage-nav button:hover {
                background: rgba(255, 255, 255, .16);
                transform: translateY(-1px);
            }
            .stage-nav button:disabled {
                opacity: .25;
                pointer-events: none;
            }
            .stage-nav-count {
                font-family: "Sora", sans-serif;
                font-variant-numeric: tabular-nums;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: .04em;
                color: rgba(255, 255, 255, .55);
            }

            /* ---------------------------------------------------
               TOP HEADER — CENTERED AT TOP
               =================================================== */
            .top-header {
                position: absolute;
                top: 12px;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
                max-width: 720px;
                min-width: 320px;
                height: calc(64px + var(--safe-top));
                padding: calc(8px + var(--safe-top)) 20px 8px;
                display: grid;
                grid-template-columns: auto 1fr auto;
                align-items: center;
                gap: 16px;
                background: rgba(8, 10, 14, .82);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid var(--panel-line);
                border-radius: 0 0 24px 24px;
                z-index: 65;
                box-shadow: 0 12px 40px -12px rgba(0, 0, 0, .7);
                left: 50% !important;
                right: auto !important;
            }

            .logo {
                display: block;
                font-size: 18px;
                justify-self: start;
                text-shadow: 0 2px 8px rgba(0, 0, 0, .5);
            }

            .feed-switcher {
                position: static;
                transform: none;
                justify-self: center;
                background: rgba(0, 0, 0, .3);
                border-color: rgba(255, 255, 255, .08);
            }

            .search-button {
                position: static;
                justify-self: end;
                width: 40px;
                height: 40px;
                font-size: 17px;
                background: rgba(255, 255, 255, .06);
                border-color: rgba(255, 255, 255, .08);
            }
            .search-button:hover {
                background: rgba(255, 255, 255, .14);
            }

            .bottom-nav {
                display: none;
            }

            /* ---------------------------------------------------
               SEARCH — centered dialog
               --------------------------------------------------- */
            .search-screen {
                inset: 0;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                background: rgba(0, 0, 0, .6);
                backdrop-filter: blur(6px);
                padding-top: calc(100px + var(--safe-top));
                transform: none;
                opacity: 0;
                visibility: hidden;
                transition: opacity .22s, visibility .22s;
            }
            .search-screen.open {
                opacity: 1;
                visibility: visible;
            }
            .search-screen>.search-top,
            .search-screen>.search-results-title,
            .search-screen>.search-results {
                width: 100%;
                max-width: 440px;
            }
            .search-top {
                background: #0f0f0f;
                border: 1px solid var(--panel-line);
                border-radius: 16px 16px 0 0;
                padding: 14px;
                height: auto;
            }
            .search-results-title,
            .search-results {
                background: #0f0f0f;
                border: 1px solid var(--panel-line);
                border-top: 0;
                border-radius: 0 0 16px 16px;
                padding: 6px 14px 14px;
                max-height: min(52dvh, 460px);
            }

            /* ---------------------------------------------------
               COMMENTS / SHARE / UPLOAD — right-side drawers
               --------------------------------------------------- */
            .comments-sheet,
            .share-sheet,
            .upload-sheet {
                left: auto;
                right: 0;
                bottom: 0;
                top: 0;
                width: min(28vw, 380px);
                height: 100%;
                border-radius: 0;
                border-left: 1px solid var(--panel-line);
                background: #0b0c10;
                box-shadow: -30px 0 60px -30px rgba(0, 0, 0, .9);
                transform: translateX(100%);
            }
            .sheet-overlay.open .comments-sheet {
                transform: translateX(0);
            }
            .sheet-overlay.share-open .share-sheet {
                transform: translateX(0);
            }
            .sheet-overlay.upload-open .upload-sheet {
                transform: translateX(0);
            }
            .share-sheet,
            .upload-sheet {
                display: flex;
                flex-direction: column;
            }
            .share-grid {
                margin-top: auto;
                margin-bottom: auto;
            }
            .sheet-handle {
                display: none;
            }
            .sheet-header {
                justify-content: flex-start;
                padding-left: 20px;
            }
        }

        /* =========================================================
           CUSTOM DELETE MODAL
           ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity .25s, visibility .25s;
        }
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: #1c1c1e;
            border: 1px solid #333;
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            transform: scale(.95);
            transition: transform .25s cubic-bezier(.2, .8, .2, 1);
        }
        .modal-overlay.open .modal-content {
            transform: scale(1);
        }
        .modal-content h3 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .modal-content p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 24px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: 0;
            border-radius: 30px;
            font-weight: 800;
            font-size: 14px;
            transition: background .15s;
        }
        .modal-cancel {
            background: #2c2c2e;
            color: #fff;
        }
        .modal-cancel:hover {
            background: #3a3a3c;
        }
        .modal-confirm {
            background: var(--danger);
            color: #fff;
        }
        .modal-confirm:hover {
            background: #e02a38;
        }

        /* =========================================================
           VERY SMALL PHONES
           ========================================================= */
        @media (max-width: 340px) {
            .logo {
                font-size: 20px;
            }
            .feed-switcher button {
                padding: 7px 8px;
                font-size: 10px;
            }
            .actions {
                right: 5px;
                gap: 10px;
            }
            .action-button {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .reel-info {
                right: 62px;
            }
            .caption {
                font-size: 12px;
            }
        }

        /* =========================================================
           LANDSCAPE PHONE
           ========================================================= */
        @media (max-height: 500px) and (orientation: landscape) {
            .reel-info {
                bottom: 15px;
            }
            .actions {
                bottom: 70px;
                gap: 8px;
            }
            .action-button {
                width: 38px;
                height: 38px;
            }
            .bottom-nav {
                display: none;
            }
        }

        /* =========================================================
           REDUCED MOTION
           ========================================================= */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- =====================================================
        REELS FEED (populated dynamically — see script)
        ===================================================== -->

        <main class="reel-feed" id="reelFeed">
            <div class="state-screen" id="reelState">
                <span class="mark">α</span>
                <p>Loading reels…</p>
            </div>
        </main>

        <!-- =====================================================
        TOP HEADER — centered on desktop
        ===================================================== -->

        <header class="top-header">

            <div class="logo">Alpha<span>Reels</span></div>

            <div class="feed-switcher" id="feedSwitcher">
                <button data-tab="following">Following</button>
                <button data-tab="foryou" class="active">For You</button>
                <button data-tab="nearby">Nearby</button>
                <button data-tab="live">Live</button>
            </div>

            <button class="search-button" id="openSearchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>

        </header>

        <!-- =====================================================
        MOBILE BOTTOM NAV
        ===================================================== -->

        <nav class="bottom-nav">

            <button class="bottom-nav-item" id="navHome">
                <span class="bottom-nav-icon"><i class="fa-solid fa-house"></i></span>
                Home
            </button>

            <button class="bottom-nav-item" id="bottomSearch">
                <span class="bottom-nav-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                Search
            </button>

            <button class="bottom-nav-item create-nav" id="bottomCreate">
                <span class="bottom-nav-icon"><i class="fa-solid fa-plus"></i></span>
                Create
            </button>

            <button class="bottom-nav-item active">
                <span class="bottom-nav-icon"><i class="fa-solid fa-film"></i></span>
                Reels
            </button>

            <button class="bottom-nav-item" id="navProfile">
                <span class="bottom-nav-icon"><i class="fa-solid fa-user"></i></span>
                Profile
            </button>

        </nav>

        <!-- =====================================================
        SEARCH SCREEN
        ===================================================== -->

        <section class="search-screen" id="searchScreen">

            <div class="search-top">
                <button class="close-search" id="closeSearch"><i class="fa-solid fa-xmark"></i></button>
                <input id="searchInput" class="search-field" type="search" placeholder="Search Alpha..." autocomplete="off">
            </div>

            <div class="search-results-title">Suggested creators</div>

            <div class="search-results" id="searchResults">
                <div class="search-empty">Loading creators…</div>
            </div>

        </section>

        <!-- =====================================================
        COMMENTS + SHARE + UPLOAD OVERLAY
        ===================================================== -->

        <div class="sheet-overlay" id="sheetOverlay">

            <!-- COMMENTS -->

            <section class="comments-sheet">

                <div class="sheet-handle"></div>

                <header class="sheet-header">
                    <div class="sheet-title" id="commentsCount">Comments</div>
                    <button class="sheet-close" id="closeComments"><i class="fa-solid fa-xmark"></i></button>
                </header>

                <div class="comments-list" id="commentsList"></div>

                <form class="comment-form" id="commentForm">
                    <input id="commentInput" class="comment-input" placeholder="Add a comment..." autocomplete="off">
                    <button class="comment-send" type="submit"><i class="fa-solid fa-paper-plane"></i></button>
                </form>

            </section>

            <!-- SHARE -->

            <section class="share-sheet">

                <div class="sheet-handle"></div>

                <header class="sheet-header">
                    <div class="sheet-title">Share Reel</div>
                    <button class="sheet-close" id="closeShare"><i class="fa-solid fa-xmark"></i></button>
                </header>

                <div class="share-grid">

                    <div class="share-option" data-share="message">
                        <div class="share-icon"><i class="fa-solid fa-comment-dots"></i></div>
                        Messages
                    </div>

                    <div class="share-option" data-share="copy">
                        <div class="share-icon"><i class="fa-solid fa-copy"></i></div>
                        Copy link
                    </div>

                    <div class="share-option" data-share="whatsapp">
                        <div class="share-icon"><i class="fa-brands fa-whatsapp"></i></div>
                        WhatsApp
                    </div>

                    <div class="share-option" data-share="telegram">
                        <div class="share-icon"><i class="fa-brands fa-telegram"></i></div>
                        Telegram
                    </div>

                </div>

            </section>

            <!-- CREATE / UPLOAD -->

            <section class="upload-sheet">

                <div class="sheet-handle"></div>

                <h3>Create Reel</h3>

                <div class="upload-drop" id="uploadDrop">
                    <i class="fa-solid fa-clapperboard"></i> Tap to choose a video
                </div>

                <input type="file" id="uploadFileInput" accept="video/*" style="display:none;">

                <textarea class="upload-caption" id="uploadCaption" rows="3" placeholder="Say something about this reel... #hashtags welcome"></textarea>

                <div class="upload-actions">
                    <button class="upload-cancel" id="uploadCancel" type="button">Cancel</button>
                    <button class="upload-submit" id="uploadSubmit" type="button" disabled>Post</button>
                </div>

            </section>

        </div>

        <!-- =====================================================
        CUSTOM DELETE MODAL
        ===================================================== -->

        <div class="modal-overlay" id="deleteModal">
            <div class="modal-content">
                <h3>Delete Reel?</h3>
                <p>This action cannot be undone.</p>
                <div class="modal-actions">
                    <button class="modal-cancel" id="deleteCancel">Cancel</button>
                    <button class="modal-confirm" id="deleteConfirm">Delete</button>
                </div>
            </div>
        </div>

        <!-- =====================================================
        TOAST
        ===================================================== -->

        <div class="toast" id="toast"></div>

    </div>

    <script>
        /* =========================================================
           CONFIG
           ========================================================= */
        const API_BASE = 'https://alpha-auth.murwanashyakadieumerci540.workers.dev';

        /* =========================================================
           DOM SHORTCUTS
           ========================================================= */
        const $ = (sel) => document.querySelector(sel);
        const feed = document.getElementById("reelFeed");
        const toastEl = document.getElementById("toast");
        let toastTimer;
        let reels = [];
        let videos = [];
        let activeReel = null;
        let currentTab = 'foryou';
        let commentsReelId = null;
        let creatorsCache = null;
        let observer = null;
        let lastTap = 0;
        let currentDeleteTarget = null;

        /* =========================================================
           SESSION
           ========================================================= */
        function getSession() {
            const token = window.AlphaCommon ? window.AlphaCommon.getToken() : localStorage.getItem('alpha_token');
            const user = window.AlphaCommon ? window.AlphaCommon.getUser() : null;
            return { token, user };
        }

        function requireAuth(action) {
            const { token, user } = getSession();
            if (token && user && user.id) {
                action();
                return;
            }
            showToast('Log in to do that');
            setTimeout(() => { window.location.href = 'login.html'; }, 600);
        }

        /* =========================================================
           TOAST
           ========================================================= */
        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.classList.remove("show");
            }, 1800);
        }

        /* =========================================================
           API HELPER
           ========================================================= */
        async function api(path, opts = {}) {
            const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
            const { token } = getSession();
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const res = await fetch(API_BASE + path, { ...opts, headers });
            let data = null;
            try { data = await res.json(); } catch {}
            if (!res.ok) throw new Error((data && data.error) || 'Request failed');
            return data;
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        function timeAgo(iso) {
            if (!iso) return '';
            const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
            if (s < 60) return 'now';
            if (s < 3600) return Math.floor(s / 60) + 'm';
            if (s < 86400) return Math.floor(s / 3600) + 'h';
            return Math.floor(s / 86400) + 'd';
        }

        function renderCaption(text) {
            if (!text) return '';
            return escapeHtml(text).replace(/#(\w+)/g, '<span class="hashtags">#$1</span>');
        }

        function formatCount(number) {
            if (number >= 1000000) return (number / 1000000).toFixed(1) + "M";
            if (number >= 1000) return (number / 1000).toFixed(1) + "K";
            return number;
        }

        /* =========================================================
           RENDER REELS
           ========================================================= */
        function renderReels(reelsToRender) {
            if (!reelsToRender || !reelsToRender.length) {
                feed.innerHTML = `
                        <div class="state-screen">
                            <span class="mark">α</span>
                            <p>No reels here yet.</p>
                            <button id="emptyCreateBtn">Create a reel</button>
                        </div>
                    `;
                document.getElementById('emptyCreateBtn')?.addEventListener('click', () => requireAuth(openUpload));
                return;
            }
            feed.innerHTML = '';
            reelsToRender.forEach(r => feed.appendChild(buildReelSection(r)));
            videos = reelsToRender.map(r => feed.querySelector(`.reel[data-id="${r.id}"] .reel-video`));
            setupObserver();

            // Deep-link: jump straight to a specific reel if ?id= is present
            const deepLinkId = new URLSearchParams(location.search).get('id');
            const targetReel = deepLinkId ? feed.querySelector(`.reel[data-id="${deepLinkId}"]`) : null;

            if (targetReel) {
                targetReel.scrollIntoView({ behavior: 'instant', block: 'start' });
                playActiveReel(targetReel);
            } else {
                // Play the first reel
                const firstReel = feed.querySelector('.reel');
                if (firstReel) {
                    playActiveReel(firstReel);
                }
            }
        }

        /* =========================================================
           FEED LOADING
           ========================================================= */
        async function loadFeed(tab) {
            currentTab = tab;
            if (observer) observer.disconnect();
            feed.innerHTML = `
                    <div class="state-screen">
                        <span class="mark">α</span>
                        <p>Loading reels…</p>
                    </div>
                `;
            try {
                const { user } = getSession();
                const qs = new URLSearchParams({ sort: tab === 'following' ? 'following' : 'foryou' });
                if (user && user.id) qs.set('uid', user.id);
                let data = await api('/reels?' + qs.toString());
                reels = data || [];

                // --- Nearby Tab Logic ---
                if (tab === 'nearby') {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(pos => {
                            const { latitude, longitude } = pos.coords;
                            const nearby = reels.filter(r => {
                                // Mock: if reel has lat/lng, calculate distance. Else, fallback to showing all.
                                if (r.lat && r.lng) {
                                    const dist = getDistance(latitude, longitude, r.lat, r.lng);
                                    return dist < 50; // within 50km
                                }
                                return true; // if no location data, treat as nearby (or false if strict)
                            });
                            renderReels(nearby.length ? nearby : reels);
                        }, () => {
                            showToast('Enable location to see nearby reels');
                            renderReels(reels);
                        });
                    } else {
                        showToast('Geolocation not supported');
                        renderReels(reels);
                    }
                    return;
                }

                // --- Live Tab Logic ---
                if (tab === 'live') {
                    const liveReels = reels.filter(r => r.is_live === true);
                    if (liveReels.length) {
                        renderReels(liveReels);
                    } else {
                        feed.innerHTML = `
                                <div class="state-screen">
                                    <span class="mark"><i class="fa-solid fa-satellite-dish"></i></span>
                                    <p>No live streams right now. Be the first to go live!</p>
                                    <button id="goLiveBtn">Go Live</button>
                                </div>
                            `;
                        document.getElementById('goLiveBtn')?.addEventListener('click', () => requireAuth(openUpload));
                    }
                    return;
                }

                // Default: Following / For You
                renderReels(reels);

            } catch (e) {
                feed.innerHTML = `
                        <div class="state-screen">
                            <span class="mark">α</span>
                            <p>Couldn't reach Alpha (${escapeHtml(e.message)}).</p>
                            <button id="retryBtn">Retry</button>
                        </div>
                    `;
                document.getElementById('retryBtn')?.addEventListener('click', () => loadFeed(tab));
            }
        }

        // Helper: Distance calculation
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function findReel(id) {
            return reels.find(r => r.id === id);
        }

        /* =========================================================
           BUILD A REEL SECTION
           ========================================================= */
        function buildReelSection(r) {
            const { user } = getSession();
            const liked = user && r.liked_by && r.liked_by.includes(user.id);
            const saved = user && r.saved_by && r.saved_by.includes(user.id);
            const isOwn = user && r.uid === user.id;
            const isVerified = r.verified && r.verified !== 'none';
            const authorName = r.author || 'user';
            const avatarUrl = r.author_avatar || ('https://i.pravatar.cc/150?u=' + encodeURIComponent(r.uid || authorName));

            const section = document.createElement('section');
            section.className = 'reel';
            section.dataset.id = r.id;

            section.innerHTML = `
                    <div class="reel-stage">
                        <video class="reel-video" loop muted playsinline preload="metadata" src="${r.video_url}"></video>
                        <div class="reel-gradient"></div>
                        <div class="play-indicator"><i class="fa-solid fa-play"></i></div>
                        <div class="big-heart"><i class="fa-solid fa-heart"></i></div>
                        <div class="progress"><div class="progress-bar"></div></div>
                    </div>
                    <div class="reel-side">
                        <div class="reel-info">
                            <div class="creator">
                                <img class="avatar" src="${avatarUrl}" alt="${escapeHtml(authorName)}">
                                <div class="creator-name">
                                    ${escapeHtml(authorName)}
                                    ${isVerified ? '<span class="verified"><i class="fa-solid fa-circle-check"></i></span>' : ''}
                                </div>
                                ${isOwn ? '' : `<button class="follow">Follow</button>`}
                            </div>
                            <p class="caption">${renderCaption(r.caption)}</p>
                            <div class="audio">
                                <span class="audio-icon"><i class="fa-solid fa-music"></i></span>
                                <span>Original audio · ${escapeHtml(authorName)}</span>
                            </div>
                        </div>
                        <div class="actions">
                            <!-- Sound Action -->
                            <div class="action sound-action">
                                <button class="action-button sound-toggle"><i class="fa-solid fa-volume-xmark"></i></button>
                                <span class="action-count">Sound</span>
                            </div>
                            <!-- Like Action -->
                            <div class="action like-action ${liked ? 'liked' : ''}">
                                <button class="action-button">${liked ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>'}</button>
                                <span class="action-count">${formatCount(r.likes || 0)}</span>
                            </div>
                            <!-- Comment Action -->
                            <div class="action comment-action">
                                <button class="action-button"><i class="fa-solid fa-comment-dots"></i></button>
                                <span class="action-count">${formatCount(r.comments_count || 0)}</span>
                            </div>
                            <!-- Share Action -->
                            <div class="action share-action">
                                <button class="action-button"><i class="fa-solid fa-share"></i></button>
                                <span class="action-count">Share</span>
                            </div>
                            <!-- Save Action -->
                            <div class="action save-action ${saved ? 'saved' : ''}">
                                <button class="action-button"><i class="fa-solid fa-bookmark"></i></button>
                                <span class="action-count">${saved ? 'Saved' : 'Save'}</span>
                            </div>
                            <!-- More Action -->
                            <div class="action more-action">
                                <button class="action-button"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                            </div>
                        </div>
                    </div>
                `;

            wireReelSection(section, r);
            return section;
        }

        /* =========================================================
           WIRE UP A SINGLE REEL'S INTERACTIONS
           ========================================================= */
        function wireReelSection(section, r) {
            const video = section.querySelector('.reel-video');
            const soundToggle = section.querySelector('.sound-toggle');
            const heart = section.querySelector('.big-heart');

            // Sound Toggle
            soundToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                video.muted = !video.muted;
                soundToggle.innerHTML = video.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
                // If unmuting, mute all others
                if (!video.muted) {
                    videos.forEach(other => {
                        if (other && other !== video) {
                            other.muted = true;
                            const otherBtn = other.closest('.reel').querySelector('.sound-toggle');
                            if (otherBtn) otherBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                        }
                    });
                }
            });

            // Tap to Play/Pause, Double Tap to Like
            video.addEventListener('click', () => {
                const now = Date.now();
                if (now - lastTap < 330) {
                    likeReel(r.id, true, section);
                    animateHeart(heart);
                    lastTap = 0;
                    return;
                }
                lastTap = now;
                setTimeout(() => {
                    if (Date.now() - lastTap >= 300) {
                        togglePlay(section);
                    }
                }, 330);
            });

            // Progress Bar
            video.addEventListener('timeupdate', () => {
                if (video.duration && Number.isFinite(video.duration)) {
                    const bar = section.querySelector('.progress-bar');
                    bar.style.width = (video.currentTime / video.duration * 100) + '%';
                }
            });

            // Like
            section.querySelector('.like-action').addEventListener('click', (e) => {
                e.stopPropagation();
                likeReel(r.id, false, section);
            });

            // Save
            section.querySelector('.save-action').addEventListener('click', (e) => {
                e.stopPropagation();
                saveReel(r.id, section);
            });

            // Comment
            section.querySelector('.comment-action').addEventListener('click', (e) => {
                e.stopPropagation();
                openComments(r.id);
            });

            // Share
            section.querySelector('.share-action').addEventListener('click', (e) => {
                e.stopPropagation();
                shareReel(r);
            });

            // Follow
            const followBtn = section.querySelector('.follow');
            if (followBtn) {
                followBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    followCreator(r.uid, followBtn);
                });
            }

            // More (Delete)
            section.querySelector('.more-action').addEventListener('click', (e) => {
                e.stopPropagation();
                moreOptions(r, section);
            });
        }

        /* =========================================================
           PLAY / PAUSE / AUDIO FOCUS
           ========================================================= */
        function togglePlay(reel) {
            const video = reel.querySelector('.reel-video');
            if (video.paused) {
                video.play().catch(() => {});
                reel.classList.remove('paused');
            } else {
                video.pause();
                reel.classList.add('paused');
            }
        }

        function playActiveReel(reel) {
            if (!reel) return;
            const currentVideo = reel.querySelector('.reel-video');
            // Mute and pause all other videos
            videos.forEach(otherVideo => {
                if (otherVideo && otherVideo !== currentVideo) {
                    otherVideo.pause();
                    otherVideo.muted = true;
                    updateSoundToggle(otherVideo, true);
                }
            });
            // Unmute and play current video
            currentVideo.muted = false;
            updateSoundToggle(currentVideo, false);
            currentVideo.play().catch(() => {});
            reel.classList.remove('paused');
            activeReel = reel;
        }

        function updateSoundToggle(video, isMuted) {
            const reel = video.closest('.reel');
            if (!reel) return;
            const btn = reel.querySelector('.sound-toggle');
            if (btn) {
                btn.innerHTML = isMuted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
            }
        }

        function animateHeart(heart) {
            heart.classList.remove('show');
            void heart.offsetWidth;
            heart.classList.add('show');
            setTimeout(() => heart.classList.remove('show'), 800);
        }

        /* =========================================================
           INTERSECTION OBSERVER
           ========================================================= */
        function setupObserver() {
            observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && entry.intersectionRatio >= .65) {
                            playActiveReel(entry.target);
                            const id = Number(entry.target.dataset.id);
                            recordView(id);
                        }
                    });
                }, { threshold: [.25, .65, .9] });
            feed.querySelectorAll('.reel').forEach(reel => observer.observe(reel));
        }

        /* =========================================================
           LIKE / SAVE / VIEW / FOLLOW
           ========================================================= */
        function likeReel(id, fromDoubleTap, section) {
            requireAuth(async () => {
                const r = findReel(id);
                const { user } = getSession();
                const wasLiked = r.liked_by && r.liked_by.includes(user.id);
                if (fromDoubleTap && wasLiked) return;
                const action = section.querySelector('.like-action');
                const button = action.querySelector('.action-button');
                const count = action.querySelector('.action-count');
                try {
                    const endpoint = wasLiked ? 'unlike' : 'like';
                    const data = await api(`/reels/${id}/${endpoint}`, { method: 'POST', body: JSON.stringify({ uid: user
                                .id }) });
                    if (wasLiked) {
                        r.liked_by = r.liked_by.filter(u => u !== user.id);
                    } else {
                        if (!r.liked_by) r.liked_by = [];
                        r.liked_by.push(user.id);
                    }
                    r.likes = data.likes;
                    const newlyLiked = !wasLiked;
                    action.classList.toggle('liked', newlyLiked);
                    button.innerHTML = newlyLiked ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
                    count.textContent = formatCount(r.likes);
