                    if (newlyLiked) animateHeart(section.querySelector('.big-heart'));
                } catch (e) {
                    showToast(e.message);
                }
            });
        }

        function saveReel(id, section) {
            requireAuth(async () => {
                const { user } = getSession();
                const action = section.querySelector('.save-action');
                const count = action.querySelector('.action-count');
                try {
                    const data = await api(`/reels/${id}/save`, { method: 'POST', body: JSON.stringify({ uid: user.id }) });
                    const r = findReel(id);
                    if (!r.saved_by) r.saved_by = [];
                    if (data.saved) r.saved_by.push(user.id);
                    else r.saved_by = r.saved_by.filter(u => u !== user.id);
                    action.classList.toggle('saved', data.saved);
                    count.textContent = data.saved ? 'Saved' : 'Save';
                    showToast(data.saved ? 'Reel saved' : 'Removed from saved');
                } catch (e) {
                    showToast(e.message);
                }
            });
        }

        async function recordView(id) {
            try {
                const { user } = getSession();
                await api(`/reels/${id}/view`, { method: 'POST', body: JSON.stringify({ uid: user ? user.id : null }) });
            } catch {}
        }

        function followCreator(uid, btnEl) {
            requireAuth(async () => {
                const { user } = getSession();
                const isFollowing = btnEl.classList.contains('following');
                try {
                    const endpoint = isFollowing ? 'unfollow' : 'follow';
                    await api(`/users/${encodeURIComponent(uid)}/${endpoint}`, { method: 'POST', body: JSON.stringify({ uid: user
                                .id }) });
                    btnEl.classList.toggle('following');
                    btnEl.textContent = btnEl.classList.contains('following') ? 'Following' : 'Follow';
                    showToast(btnEl.classList.contains('following') ? 'Following creator' : 'Unfollowed creator');
                } catch (e) {
                    showToast(e.message);
                }
            });
        }

        /* =========================================================
           DELETE MODAL LOGIC
           ========================================================= */
        function moreOptions(r, section) {
            const { user } = getSession();
            const isOwn = user && r.uid === user.id;
            if (!isOwn) {
                showToast('More Reel options coming soon');
                return;
            }
            currentDeleteTarget = { r, section };
            document.getElementById('deleteModal').classList.add('open');
        }

        document.getElementById('deleteCancel').addEventListener('click', () => {
            document.getElementById('deleteModal').classList.remove('open');
            currentDeleteTarget = null;
        });

        document.getElementById('deleteConfirm').addEventListener('click', async () => {
            if (!currentDeleteTarget) return;
            const { r, section } = currentDeleteTarget;
            document.getElementById('deleteModal').classList.remove('open');
            try {
                await api(`/reels/${r.id}`, { method: 'DELETE' });
                showToast('Reel deleted');
                section.remove();
                reels = reels.filter(x => x.id !== r.id);
                videos = videos.filter(v => v !== section.querySelector('.reel-video'));
                currentDeleteTarget = null;
                if (!reels.length) {
                    renderReels([]);
                }
            } catch (e) {
                showToast(e.message);
            }
        });

        /* =========================================================
           SHARE
           ========================================================= */
        function shareReel(r) {
            const link = `${location.origin}${location.pathname}?reel=${r.id}`;
            if (navigator.share) {
                navigator.share({ title: 'Alpha Reels', text: r.caption || 'Check this reel', url: link }).catch(() => {});
            } else {
                $('.sheet-overlay').dataset.shareLink = link;
                $('.sheet-overlay').classList.add('open', 'share-open');
            }
        }

        /* =========================================================
           FEED SWITCHER
           ========================================================= */
        document.querySelectorAll('#feedSwitcher button').forEach(button => {
            button.addEventListener('click', () => {
                const tab = button.dataset.tab;
                document.querySelectorAll('#feedSwitcher button').forEach(b => b.classList.remove('active'));
                button.classList.add('active');
                loadFeed(tab);
            });
        });

        /* =========================================================
           COMMENTS
           ========================================================= */
        const sheetOverlay = document.getElementById('sheetOverlay');
        const closeCommentsBtn = document.getElementById('closeComments');
        const commentsList = document.getElementById('commentsList');
        const commentForm = document.getElementById('commentForm');
        const commentInput = document.getElementById('commentInput');

        function openComments(id) {
            commentsReelId = id;
            sheetOverlay.classList.remove('share-open', 'upload-open');
            sheetOverlay.classList.add('open');
            loadComments(id);
        }

        function closeSheet() {
            sheetOverlay.classList.remove('open', 'share-open', 'upload-open');
        }

        async function loadComments(id) {
            commentsList.innerHTML = '<div class="comment-empty">Loading…</div>';
            try {
                const comments = await api(`/reels/${id}/comments`);
                document.getElementById('commentsCount').textContent =
                    `${comments.length} Comment${comments.length === 1 ? '' : 's'}`;
                if (!comments.length) {
                    commentsList.innerHTML = '<div class="comment-empty">No comments yet. Say something!</div>';
                    return;
                }
                commentsList.innerHTML = comments.map(c => `
                        <div class="comment">
                            <img class="comment-avatar" src="https://i.pravatar.cc/100?u=${encodeURIComponent(c.author || 'user')}">
                            <div>
                                <div class="comment-user">${escapeHtml(c.author || 'User')}</div>
                                <div class="comment-text">${escapeHtml(c.text)}</div>
                                <div class="comment-time">${timeAgo(c.created_at)}</div>
                            </div>
                        </div>
                    `).join('');
            } catch (e) {
                commentsList.innerHTML = `<div class="comment-empty">${escapeHtml(e.message)}</div>`;
            }
        }

        closeCommentsBtn.addEventListener('click', closeSheet);
        sheetOverlay.addEventListener('click', (event) => {
            if (event.target === sheetOverlay) closeSheet();
        });
        commentForm.addEventListener('submit', (event) => {
            event.preventDefault();
            submitComment();
        });

        function submitComment() {
            const text = commentInput.value.trim();
            if (!text || !commentsReelId) return;
            requireAuth(async () => {
                const { user } = getSession();
                try {
                    const data = await api(`/reels/${commentsReelId}/comment`, {
                        method: 'POST',
                        body: JSON.stringify({ uid: user.id, author: user.display_name, text })
                    });
                    commentInput.value = '';
                    const r = findReel(commentsReelId);
                    if (r) r.comments_count = data.comments_count;
                    const section = feed.querySelector(`.reel[data-id="${commentsReelId}"]`);
                    if (section) section.querySelector('.comment-action .action-count').textContent = formatCount(data
                        .comments_count);
                    loadComments(commentsReelId);
                } catch (e) {
                    showToast(e.message);
                }
            });
        }

        /* =========================================================
           SHARE SHEET
           ========================================================= */
        document.getElementById('closeShare').addEventListener('click', closeSheet);
        document.querySelectorAll('.share-option').forEach(option => {
            option.addEventListener('click', async () => {
                const type = option.dataset.share;
                const link = sheetOverlay.dataset.shareLink || location.href;
                if (type === 'copy') {
                    try {
                        await navigator.clipboard.writeText(link);
                        showToast('Reel link copied');
                    } catch {
                        showToast('Copy link unavailable');
                    }
                }
                if (type === 'message') showToast('Opening Alpha Messages...');
                if (type === 'whatsapp') showToast('Opening WhatsApp...');
                if (type === 'telegram') showToast('Opening Telegram...');
                closeSheet();
            });
        });

        /* =========================================================
           UPLOAD / CREATE REEL
           ========================================================= */
        let selectedFile = null;
        const uploadDrop = document.getElementById('uploadDrop');
        const uploadFileInput = document.getElementById('uploadFileInput');
        const uploadCaption = document.getElementById('uploadCaption');
        const uploadSubmitBtn = document.getElementById('uploadSubmit');
        const uploadCancelBtn = document.getElementById('uploadCancel');

        function openUpload() {
            sheetOverlay.classList.remove('share-open');
            sheetOverlay.classList.add('open', 'upload-open');
        }

        function closeUpload() {
            sheetOverlay.classList.remove('upload-open', 'open');
            selectedFile = null;
            uploadFileInput.value = '';
            uploadCaption.value = '';
            uploadDrop.classList.remove('has-file');
            uploadDrop.innerHTML = '<i class="fa-solid fa-clapperboard"></i> Tap to choose a video';
            uploadSubmitBtn.disabled = true;
            uploadSubmitBtn.textContent = 'Post';
        }

        uploadDrop.addEventListener('click', () => uploadFileInput.click());
        uploadFileInput.addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (!f) return;
            selectedFile = f;
            uploadDrop.classList.add('has-file');
            uploadDrop.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' + escapeHtml(f.name);
            uploadSubmitBtn.disabled = false;
        });
        uploadCancelBtn.addEventListener('click', closeUpload);
        uploadSubmitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            uploadSubmitBtn.disabled = true;
            uploadSubmitBtn.textContent = 'Uploading…';
            try {
                const { user } = getSession();
                const form = new FormData();
                form.append('file', selectedFile);
                const uploadRes = await fetch(API_BASE + '/upload', { method: 'POST', body: form });
                const uploadData = await uploadRes.json();
                if (!uploadRes.ok) throw new Error(uploadData.error || 'Upload failed');
                await api('/reels', {
                    method: 'POST',
                    body: JSON.stringify({
                        video_url: uploadData.url,
                        caption: uploadCaption.value.trim(),
                        uid: user.id,
                        author: user.display_name
                    })
                });
                showToast('Reel posted');
                closeUpload();
                loadFeed(currentTab);
            } catch (e) {
                showToast(e.message);
                uploadSubmitBtn.disabled = false;
                uploadSubmitBtn.textContent = 'Post';
            }
        });
        document.getElementById('bottomCreate').addEventListener('click', () => requireAuth(openUpload));

        /* =========================================================
           SEARCH SCREEN
           ========================================================= */
        const searchScreen = document.getElementById('searchScreen');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        async function ensureCreatorsLoaded() {
            if (creatorsCache) return creatorsCache;
            try {
                const users = await api('/users');
                creatorsCache = users || [];
            } catch {
                creatorsCache = [];
            }
            return creatorsCache;
        }

        function renderSearchResults(list, query) {
            if (!list.length) {
                searchResults.innerHTML = '<div class="search-empty">No creators found.</div>';
                return;
            }
            const q = (query || '').toLowerCase();
            const filtered = !q ? list : list.filter(u =>
                (u.display_name || '').toLowerCase().includes(q) ||
                (u.email || '').toLowerCase().includes(q)
            );
            if (!filtered.length) {
                searchResults.innerHTML = '<div class="search-empty">No creators found.</div>';
                return;
            }
            searchResults.innerHTML = filtered.map(u => `
                    <div class="search-result" data-uid="${escapeHtml(u.email)}">
                        <img src="${u.avatar_url || ('https://i.pravatar.cc/150?u=' + encodeURIComponent(u.email))}">
                        <div class="search-result-info">
                            <div class="search-result-name">
                                ${escapeHtml(u.display_name || u.email)}
                                ${u.verified && u.verified !== 'none' ? '<i class="fa-solid fa-circle-check"></i>' : ''}
                            </div>
                            <div class="search-result-meta">${escapeHtml(u.bio || u.email)}</div>
                        </div>
                    </div>
                `).join('');
            searchResults.querySelectorAll('.search-result').forEach(el => {
                el.addEventListener('click', () => {
                    showToast('Opening profile — coming soon');
                });
            });
        }

        async function openSearch() {
            searchScreen.classList.add('open');
            setTimeout(() => searchInput.focus(), 250);
            const list = await ensureCreatorsLoaded();
            renderSearchResults(list, searchInput.value);
        }

        function closeSearch() {
            searchScreen.classList.remove('open');
            searchInput.value = '';
        }
        document.getElementById('openSearchBtn').addEventListener('click', openSearch);
        document.getElementById('bottomSearch').addEventListener('click', openSearch);
        document.getElementById('closeSearch').addEventListener('click', closeSearch);
        searchInput.addEventListener('input', () => {
            renderSearchResults(creatorsCache || [], searchInput.value);
        });
        searchInput.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeSearch();
        });

        /* =========================================================
           OTHER BOTTOM NAV
           ========================================================= */
        document.getElementById('navHome').addEventListener('click', () => { window.location.href = 'index.html'; });
        document.getElementById('navProfile').addEventListener('click', () => { window.location.href = 'settings.html'; });

        /* =========================================================
           KEYBOARD CONTROLS
           ========================================================= */
        document.addEventListener('keydown', (event) => {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;
            const all = [...feed.querySelectorAll('.reel')];
            const index = all.indexOf(activeReel);
            if (event.key === 'ArrowDown' && index < all.length - 1) {
                all[index + 1].scrollIntoView({ behavior: 'smooth' });
            }
            if (event.key === 'ArrowUp' && index > 0) {
                all[index - 1].scrollIntoView({ behavior: 'smooth' });
            }
            if (event.key === ' ') {
                event.preventDefault();
                if (activeReel) togglePlay(activeReel);
            }
        });

        /* =========================================================
           VISIBILITY
           ========================================================= */
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                videos.forEach(video => video && video.pause());
            } else if (activeReel) {
                playActiveReel(activeReel);
            }
        });

        /* =========================================================
           INIT
           ========================================================= */
        loadFeed('foryou');
    </script>

</body>
</html>
