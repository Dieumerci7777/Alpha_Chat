<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Alpha — AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" rel="stylesheet">
    <script src="alpha-common.js"></script>
    <style>
        /* ============================================================
           RESET & VARIABLES — matches index.html / status.html
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #f0f2f6;
            --surface: #ffffff;
            --surface-hover: #f4f6fa;
            --surface-raised: #ffffff;
            --text-primary: #0b0d12;
            --text-secondary: #565e70;
            --text-muted: #8e96a8;
            --border: #e4e8ef;
            --border-light: #edf0f5;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 99px;
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --primary-bg: rgba(79, 70, 229, 0.08);
            --primary-bg-hover: rgba(79, 70, 229, 0.16);
            --green: #22c55e;
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.10);
            --gradient-primary: linear-gradient(135deg, var(--primary), var(--primary-dark));
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-width: 220px;
            --right-width: 260px;
        }

        [data-theme="dark"] {
            --bg: #0c0e15;
            --surface: #161920;
            --surface-hover: #1e222b;
            --surface-raised: #1a1d26;
            --text-primary: #f1f3f7;
            --text-secondary: #9aa2b5;
            --text-muted: #6e768a;
            --border: #262b36;
            --border-light: #1e222b;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
            --primary-bg: rgba(79, 70, 229, 0.15);
            --primary-bg-hover: rgba(79, 70, 229, 0.25);
            --red-bg: rgba(239, 68, 68, 0.15);
        }

        html, body { height: 100%; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            font-size: 15px;
            line-height: 1.6;
        }
        button, input, textarea { font-family: inherit; font-size: inherit; }
        button { cursor: pointer; border: none; background: none; color: inherit; }
        *:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

        /* ============================================================
           APP SHELL — identical grid to index.html
           ============================================================ */
        .app {
            display: grid;
            grid-template-columns: var(--nav-width) minmax(400px, 1fr) var(--right-width);
            gap: 16px;
            max-width: 1480px;
            height: 100vh;
            margin: 0 auto;
            padding: 14px 18px;
        }

        /* ─── Left nav (same as Home) ─── */
        .left {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 10px 8px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow: hidden;
            height: 100%;
        }
        .brand {
            display: flex; align-items: center; gap: 12px;
            padding: 4px 10px 18px 10px; cursor: pointer;
            background: none; border: 0; text-align: left; color: inherit; flex-shrink: 0;
        }
        .logo {
            width: 40px; height: 40px; border-radius: var(--radius-sm);
            background: var(--gradient-primary);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; font-weight: 800;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.30); flex-shrink: 0;
        }
        .brand-name-wrap { line-height: 1.2; }
        .brand-name {
            font-size: 20px; font-weight: 800; letter-spacing: -0.02em;
            background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand-tag { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; }

        .nav { display: flex; flex-direction: column; overflow-y: auto; flex: 1; padding: 2px 2px 6px; }
        .nav::-webkit-scrollbar { width: 0; }
        .nav-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); padding: 14px 12px 6px; }
        .nav-section-label:first-child { padding-top: 2px; }
        .nav button {
            position: relative; border: 0; background: transparent; color: var(--text-secondary);
            padding: 8px 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 12px;
            font-size: 13.5px; font-weight: 600; cursor: pointer; transition: var(--transition);
            text-align: left; flex-shrink: 0; margin-bottom: 1px; width: 100%;
        }
        .nav button:hover { background: var(--surface-hover); color: var(--text-primary); }
        .nav button.active { color: var(--primary); background: var(--primary-bg); font-weight: 700; }
        .nav button.active .nav-icon { color: var(--primary); }
        .nav-icon {
            width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center;
            justify-content: center; background: transparent; color: var(--text-muted); flex-shrink: 0;
            transition: var(--transition); font-size: 15px;
        }
        .nav button:hover .nav-icon { background: var(--surface-hover); color: var(--text-primary); }

        .profile-mini {
            margin-top: 6px; background: var(--surface-hover); border-radius: var(--radius-md);
            padding: 8px 10px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; transition: var(--transition);
        }
        .profile-mini:hover { background: var(--border-light); }
        .profile-mini .name-wrap { flex: 1; min-width: 0; cursor: pointer; }
        .profile-mini .name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-mini small { color: var(--text-muted); font-size: 10.5px; }
        .profile-mini .avatar {
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; background: var(--gradient-primary); color: #fff; flex-shrink: 0;
            overflow: hidden;
        }
        .profile-mini .logout-btn {
            border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer;
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-sm); font-size: 13px; transition: var(--transition);
        }
        .profile-mini .logout-btn:hover { background: var(--red-bg); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }

        /* ============================================================
           CENTER — AI chat
           ============================================================ */
        .center { display: flex; flex-direction: column; height: 100%; min-width: 0; }
        .chat-panel {
            flex: 1; display: flex; flex-direction: column; min-height: 0;
            background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm); overflow: hidden;
        }
        .chat-header {
            padding: 14px 20px; border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 10px;
        }
        .chat-header .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .chat-header .who .avatar {
            width: 34px; height: 34px; border-radius: 50%; background: var(--gradient-primary); color: #fff;
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0;
        }
        .chat-header .title { font-weight: 800; font-size: 15px; }
        .chat-header .status { font-size: 11px; color: var(--green); display: flex; align-items: center; gap: 5px; }
        .chat-header .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulseDot 2s ease-in-out infinite; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .chat-header .actions { display: flex; gap: 6px; flex-shrink: 0; }
        .chat-header .actions button {
            width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border);
            background: var(--surface); color: var(--text-secondary); display: flex; align-items: center;
            justify-content: center; font-size: 13px; transition: var(--transition);
        }
        .chat-header .actions button:hover { background: var(--surface-hover); color: var(--primary); border-color: var(--primary); }

        /* Recent chats strip */
        .recent-strip {
            display: flex; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--border-light);
            overflow-x: auto; flex-shrink: 0;
        }
        .recent-strip::-webkit-scrollbar { display: none; }
        .recent-chip {
            flex-shrink: 0; padding: 6px 14px; border-radius: var(--radius-full); border: 1px solid var(--border);
            background: var(--surface); color: var(--text-secondary); font-size: 12px; font-weight: 600;
            display: flex; align-items: center; gap: 6px; transition: var(--transition); white-space: nowrap;
        }
        .recent-chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
        .recent-chip.new { color: var(--primary); border-color: var(--primary-bg); background: var(--primary-bg); }
        .recent-chip.new:hover { background: var(--primary-bg-hover); }

        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }

        /* ─── Empty state ─── */
        .hero-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 20px; }
        .hero-empty .greeting { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
        .hero-empty .greeting span { color: var(--primary); }
        .hero-empty .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 22px; }
        .suggestions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; width: 100%; max-width: 560px; }
        .suggestion-card {
            padding: 16px 14px; border: 1px solid var(--border-light); border-radius: var(--radius-md);
            background: var(--surface-hover); cursor: pointer; transition: var(--transition); text-align: left;
        }
        .suggestion-card:hover { border-color: var(--primary); background: var(--primary-bg); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
        .suggestion-card i { font-size: 18px; color: var(--primary); margin-bottom: 8px; display: block; }
        .suggestion-card .label { font-weight: 700; font-size: 12.5px; }

        /* ─── Messages ─── */
        .msg { display: flex; gap: 10px; max-width: 100%; animation: msgIn 0.3s cubic-bezier(.2,.8,.3,1) backwards; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .msg.user { flex-direction: row-reverse; }
        .msg .avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 12px; flex-shrink: 0;
        }
        .msg .avatar.bot { background: var(--gradient-primary); color: #fff; }
        .msg .avatar.user { background: var(--primary-bg); color: var(--primary); }
        .msg .bubble { max-width: 72%; padding: 10px 14px; border-radius: var(--radius-md); font-size: 13.5px; line-height: 1.55; word-break: break-word; }
        .msg.user .bubble { background: var(--gradient-primary); color: #fff; border-radius: var(--radius-md) var(--radius-md) 4px var(--radius-md); }
        .msg.bot .bubble { background: var(--surface-hover); border: 1px solid var(--border-light); color: var(--text-primary); border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md); }
        .msg.bot .bubble a { color: var(--primary); text-decoration: underline; }
        .msg .bubble code { font-family: 'SFMono-Regular', Menlo, monospace; font-size: 12px; background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; }
        .msg .bubble pre { background: var(--surface-raised); padding: 10px; border-radius: var(--radius-sm); overflow-x: auto; margin: 4px 0; font-family: 'SFMono-Regular', Menlo, monospace; font-size: 12px; }

        .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
        .typing-indicator span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: typingDot 1.2s ease-in-out infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingDot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-7px); opacity: 1; } }

        /* ─── Composer ─── */
        .chat-input { padding: 12px 16px; border-top: 1px solid var(--border-light); display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
        .input-wrap {
            flex: 1; position: relative; display: flex; align-items: center; background: var(--bg);
            border: 1.5px solid var(--border); border-radius: var(--radius-md); transition: var(--transition);
        }
        .input-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); background: var(--surface); }
        .input-wrap textarea {
            flex: 1; padding: 10px 12px; background: transparent; border: none; color: var(--text-primary);
            font-size: 13.5px; outline: none; resize: none; min-height: 40px; max-height: 100px; line-height: 1.5;
        }
        .input-wrap textarea::placeholder { color: var(--text-muted); }
        .input-wrap .actions { display: flex; gap: 2px; padding-right: 6px; }
        .input-wrap .actions button { padding: 6px 7px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: 15px; transition: var(--transition); }
        .input-wrap .actions button:hover { background: var(--surface-hover); color: var(--primary); }
        .input-wrap .actions button.active { color: var(--primary); background: var(--primary-bg); }
        .send-btn {
            width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--gradient-primary); color: #fff;
            font-size: 15px; display: flex; align-items: center; justify-content: center; transition: var(--transition); flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
        }
        .send-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ============================================================
           RIGHT — quick tools (same shell as Home's "Trending" panel)
           ============================================================ */
        .right { padding-top: 2px; overflow-y: auto; scrollbar-width: none; height: 100%; }
        .right::-webkit-scrollbar { display: none; }
        .panel { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
        .panel-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 10px; }
        .tool-row {
            display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm);
            color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transition); width: 100%; text-align: left;
        }
        .tool-row:hover { background: var(--primary-bg); color: var(--primary); transform: translateX(2px); }
        .tool-row i { width: 18px; text-align: center; font-size: 14px; color: var(--primary); flex-shrink: 0; }

        /* ─── Toast (same as Home) ─── */
        .toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 1200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: 380px; }
        .toast { display: flex; align-items: center; gap: 10px; background: var(--surface-raised); border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: var(--radius-md); padding: 10px 16px; font-size: 13px; color: var(--text-primary); box-shadow: var(--shadow-lg); pointer-events: auto; animation: toastIn 0.4s cubic-bezier(0.4,0,0.2,1); }
        .toast i { font-size: 15px; flex-shrink: 0; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(30px) scale(0.95); } to { opacity: 1; transform: none; } }
        .toast-close { background: none; border: 0; color: var(--text-muted); cursor: pointer; padding: 0 4px; margin-left: auto; font-size: 13px; }
        .toast-close:hover { color: var(--red); }

        /* ─── Mobile bottom nav (same as Home) ─── */
        .mobile-nav { display: none; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1100px) {
            .app { grid-template-columns: 180px minmax(400px, 1fr); }
            .right { display: none; }
            :root { --nav-width: 180px; }
        }
        @media (max-width: 760px) {
            body { overflow: hidden; }
            .app { display: block; padding: 0; height: 100vh; }
            .left { display: none; }
            .center { height: 100vh; padding: 10px 10px 82px; }
            .chat-panel { border-radius: var(--radius-md); height: 100%; }
            .mobile-nav {
                position: fixed; left: 10px; right: 10px; bottom: 10px; height: 58px; display: flex;
                align-items: center; justify-content: space-around; background: var(--surface-raised);
                border: 1px solid var(--border); border-radius: var(--radius-lg); z-index: 1000; box-shadow: var(--shadow-lg);
            }
            .mobile-nav button { width: 46px; height: 46px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 16px; transition: var(--transition); }
            .mobile-nav button.active { color: var(--primary); background: var(--primary-bg); }
            .toast-wrap { bottom: 80px; right: 12px; left: 12px; max-width: 100%; }
            .suggestions { grid-template-columns: 1fr 1fr; }
            .hero-empty .greeting { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="app">

    <!-- ═══ LEFT NAV — identical to Home ═══ -->
    <aside class="left">
        <button class="brand" onclick="goHome()">
            <div class="logo">A</div>
            <div class="brand-name-wrap">
                <div class="brand-name">Alpha</div>
                <div class="brand-tag">Social</div>
            </div>
        </button>

        <nav class="nav">
            <div class="nav-section-label">Main</div>
            <button onclick="goHome()"><span class="nav-icon"><i class="fa-solid fa-house"></i></span> Home</button>
            <button onclick="goToExplore()"><span class="nav-icon"><i class="fa-solid fa-compass"></i></span> Explore</button>
            <button onclick="goToReels()"><span class="nav-icon"><i class="fa-solid fa-film"></i></span> Reels</button>
            <button onclick="goToChat()"><span class="nav-icon"><i class="fa-solid fa-comment-dots"></i></span> Messages</button>
           
            <div class="nav-section-label">Activity</div>
            <button onclick="goToCalls()"><span class="nav-icon"><i class="fa-solid fa-phone"></i></span> Calls</button>
            <button onclick="goToStatus()"><span class="nav-icon"><i class="fa-solid fa-circle-dot"></i></span> Status</button>
            <button onclick="goToEvents()"><span class="nav-icon"><i class="fa-solid fa-calendar-days"></i></span> Events</button>

            <div class="nav-section-label">Workspace</div>
            <button class="active" onclick="goToAI()"><span class="nav-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span> AI</button>
            <button onclick="goToVault()"><span class="nav-icon"><i class="fa-solid fa-shield-halved"></i></span> Vault</button>
            <button onclick="toggleTheme()"><span class="nav-icon"><i class="fa-solid fa-moon" id="theme-icon"></i></span> Theme</button>
            <button onclick="goToSettings()"><span class="nav-icon"><i class="fa-solid fa-gear"></i></span> Settings</button>
        </nav>

        <div class="profile-mini">
            <div class="avatar" id="me-mini-avatar">?</div>
            <div class="name-wrap" onclick="goToSettings()">
                <div class="name" id="me-mini-name">You</div>
                <small>Signed in</small>
            </div>
            <button class="logout-btn" title="Sign out" onclick="doLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
    </aside>

    <!-- ═══ CENTER — chat ═══ -->
    <div class="center">
        <div class="chat-panel">
            <div class="chat-header">
                <div class="who">
                    <div class="avatar">A</div>
                    <div>
                        <div class="title">Alpha AI</div>
                        <div class="status"><span class="dot"></span> Online</div>
                    </div>
                </div>
                <div class="actions">
                    <button onclick="toast('Search coming soon','info')" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button onclick="clearChat()" title="Clear chat"><i class="fa-solid fa-eraser"></i></button>
                </div>
            </div>

            <div class="recent-strip">
                <button class="recent-chip new" onclick="newChat()"><i class="fa-solid fa-plus"></i> New chat</button>
                <button class="recent-chip" onclick="quickPrompt('Python project plan')">Python project plan</button>
                <button class="recent-chip" onclick="quickPrompt('Meeting summary')">Meeting summary</button>
                <button class="recent-chip" onclick="quickPrompt('Travel itinerary')">Travel itinerary</button>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="hero-empty" id="hero-empty">
                    <div class="greeting">Good <span id="greeting-time">evening</span>, <span id="user-name">User</span></div>
                    <div class="sub">How can I help today?</div>
                    <div class="suggestions">
                        <div class="suggestion-card" onclick="quickPrompt('Summarize this document')">
                            <i class="fa-solid fa-file-lines"></i>
                            <div class="label">Summarize</div>
                        </div>
                        <div class="suggestion-card" onclick="quickPrompt('Write Python code for a REST API')">
                            <i class="fa-solid fa-code"></i>
                            <div class="label">Generate code</div>
                        </div>
                        <div class="suggestion-card" onclick="quickPrompt('Translate this to French')">
                            <i class="fa-solid fa-language"></i>
                            <div class="label">Translate</div>
                        </div>
                        <div class="suggestion-card" onclick="quickPrompt('Create an image prompt')">

            <div class="chat-input">

                    <input type="file" id="file-input" style="display:none" onchange="handleFile(this)" />

            <button class="tool-row" onclick="quickPrompt('Research the latest tech trends')"><i class="fa-solid fa-magnifying-glass"></i> Research</button>
            <button class="tool-row" onclick="quickPrompt('Translate this text to Kinyarwanda')"><i class="fa-solid fa-language"></i> Translate</button>

            <button class="tool-row" onclick="quickPrompt('Fix this grammar')"><i class="fa-solid fa-spell-check"></i> Grammar</button>

</div>

<nav class="mobile-nav">
    <button onclick="goHome()"><i class="fa-solid fa-house"></i></button>
    <button onclick="goToExplore()"><i class="fa-solid fa-compass"></i></button>
    <button onclick="goToChat()"><i class="fa-solid fa-comment-dots"></i></button>
    <button class="active" onclick="goToAI()"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
    <button onclick="goToSettings()"><i class="fa-solid fa-user"></i></button>
</nav>

<!-- Toast -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const CF_API_BASE = 'https://alpha-auth.murwanashyakadieumerci540.workers.dev';
let CF_TOKEN = localStorage.getItem('alpha_token') || null;
let CU = null;
let UP = { display_name: '', bio: '', avatar_color: 'av-primary', avatar_url: null };
let aiHistory = [];
let isVoiceActive = false;
let recognition = null;

// ============================================================
// THEME
// ============================================================
function initTheme() {
    const saved = localStorage.getItem('alpha_theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    const icon = document.getElementById('theme-icon');
    if (icon) icon.className = 'fa-solid ' + (saved === 'dark' ? 'fa-sun' : 'fa-moon');
}
window.toggleTheme = function() {
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    localStorage.setItem('alpha_theme', cur);
    const icon = document.getElementById('theme-icon');
    if (icon) icon.className = 'fa-solid ' + (cur === 'dark' ? 'fa-sun' : 'fa-moon');
};
initTheme();

// ============================================================
// API HELPERS
// ============================================================
async function cfApi(endpoint, method = 'GET', body = null) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (CF_TOKEN) opts.headers['Authorization'] = `Bearer ${CF_TOKEN}`;
    if (body) opts.body = JSON.stringify(body);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    opts.signal = controller.signal;
    let res;
    try {
        res = await fetch(`${CF_API_BASE}${endpoint}`, opts);
    } catch (e) {
        throw new Error(e.name === 'AbortError' ? 'Request timed out — check your connection' : e.message);
    } finally {
        clearTimeout(timer);
    }
    let data = {};
    try { data = await res.json(); } catch (e) { data = {}; }
    if (!res.ok) throw new Error(data.error || data.message || `Request failed (${res.status})`);
    return data;
}

// ============================================================
// TOAST
// ============================================================
function toast(msg, type = 'success') {
    const wrap = document.getElementById('toast-wrap');
    if (!wrap) return;
    const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<i class="fa-solid ${icons[type] || 'fa-wand-magic-sparkles'}"></i><span>${msg}</span><button class="toast-close" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>`;
    wrap.appendChild(t);
    setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(16px)';
        setTimeout(() => t.remove(), 300);
    }, 3000);
}
window.toast = toast;

// ============================================================
// UTILITIES
// ============================================================
function sanitizeInput(input) {
    const div = document.createElement('div');
    div.textContent = input;
    return div.innerHTML;
}

function linkify(t) {
    if (!t) return '';
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>')
        .replace(/(#\w+)/g, '<span style="color:var(--primary);">$1</span>')
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" style="color:var(--primary);text-decoration:underline;">$1</a>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function getGreeting() {
    const h = new Date().getHours();
    if (h < 12) return 'morning';
    if (h < 17) return 'afternoon';
    if (h < 21) return 'evening';
    return 'night';
}

// ============================================================
// MESSAGES
// ============================================================
function addMessage(role, content, isHTML = false) {
    const el = document.getElementById('chat-messages');
    if (!el) return;
    const hero = document.getElementById('hero-empty');
    if (hero) hero.style.display = 'none';

    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const avatar = role === 'user'
        ? `<div class="avatar user">${UP.display_name ? UP.display_name.charAt(0).toUpperCase() : 'U'}</div>`
        : `<div class="avatar bot">A</div>`;
    const body = isHTML ? content : linkify(sanitizeInput(content));
    div.innerHTML = `${avatar}<div class="bubble">${body}</div>`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

function showTyping() {
    const el = document.getElementById('chat-messages');
    if (!el) return;
    const hero = document.getElementById('hero-empty');
    if (hero) hero.style.display = 'none';

    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing-indicator';
    div.innerHTML = `<div class="avatar bot">A</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
}

// ============================================================
// CHAT ACTIONS
// ============================================================
let lastMessageTime = 0;
const MIN_MESSAGE_INTERVAL = 2000;

window.sendAI = async function() {
    const now = Date.now();
    if (now - lastMessageTime < MIN_MESSAGE_INTERVAL) {
        toast('Please wait a moment before sending another message.', 'info');
        return;
    }
    lastMessageTime = now;

    const input = document.getElementById('ai-input');
    const msg = input?.value?.trim();
    if (!msg) return;
    input.value = '';
    input.style.height = 'auto';
    const btn = document.getElementById('send-btn');
    btn.disabled = true;

    addMessage('user', msg);
    showTyping();

    try {
        const data = await cfApi('/ai', 'POST', { message: msg, history: aiHistory });
        hideTyping();
        aiHistory.push({ role: 'user', content: msg });
        aiHistory.push({ role: 'assistant', content: data.reply });
        addMessage('bot', data.reply);
    } catch (e) {
        hideTyping();
        addMessage('bot', 'Error: ' + e.message);
        toast('AI request failed: ' + e.message, 'error');
    }
    btn.disabled = false;
};

window.quickPrompt = function(prompt) {
    document.getElementById('ai-input').value = prompt;
    sendAI();
};

window.newChat = function() {
    if (confirm('Start a new chat? The current conversation will be cleared.')) {
        clearChat();
    }
};

window.clearChat = function() {
    aiHistory = [];
    const el = document.getElementById('chat-messages');
    el.innerHTML = `
        <div class="hero-empty" id="hero-empty">
            <div class="greeting">Good <span id="greeting-time">${getGreeting()}</span>, <span id="user-name">${UP.display_name || 'User'}</span></div>
            <div class="sub">How can I help today?</div>
            <div class="suggestions">
                <div class="suggestion-card" onclick="quickPrompt('Summarize this document')">
                    <i class="fa-solid fa-file-lines"></i>
                    <div class="label">Summarize</div>
                </div>
                <div class="suggestion-card" onclick="quickPrompt('Write Python code for a REST API')">
                    <i class="fa-solid fa-code"></i>
                    <div class="label">Generate code</div>
                </div>
                <div class="suggestion-card" onclick="quickPrompt('Translate this to French')">
                    <i class="fa-solid fa-language"></i>
                    <div class="label">Translate</div>
                </div>
                <div class="suggestion-card" onclick="quickPrompt('Create an image prompt')">
                    <i class="fa-solid fa-image"></i>
                    <div class="label">Create images</div>
                </div>
                <div class="suggestion-card" onclick="quickPrompt('Explain quantum computing')">
                    <i class="fa-solid fa-lightbulb"></i>
                    <div class="label">Explain a concept</div>
                </div>
                <div class="suggestion-card" onclick="quickPrompt('Brainstorm startup ideas')">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <div class="label">Brainstorm</div>
                </div>
            </div>
        </div>
    `;
    toast('Chat cleared');
};

// ============================================================
// FILE ATTACHMENT
// ============================================================
window.handleFile = function(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const content = e.target.result;
        const preview = content.slice(0, 500) + (content.length > 500 ? '…' : '');
        toast(`"${file.name}" attached (${Math.round(file.size/1024)} KB)`, 'info');
        document.getElementById('ai-input').value = `I've attached a file: ${file.name}\n\nContent preview:\n${preview}\n\nPlease help me analyze this.`;
        input.value = '';
    };
    reader.readAsText(file);
};

// ============================================================
// VOICE INPUT
// ============================================================
window.toggleVoice = function() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        toast('Voice input is not supported in this browser', 'info');
        return;
    }

    const btn = document.getElementById('voice-btn');
    if (isVoiceActive) {
        if (recognition) recognition.stop();
        isVoiceActive = false;
        btn.classList.remove('active');
        toast('Voice input stopped', 'info');
        return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = function() {
        isVoiceActive = true;
        btn.classList.add('active');
        toast('Listening… speak now', 'info');
    };

    recognition.onresult = function(event) {
        let final = '';
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) final += transcript;
            else interim += transcript;
        }
        const input = document.getElementById('ai-input');
        if (final) {
            input.value = final;
            recognition.stop();
            isVoiceActive = false;
            btn.classList.remove('active');
            toast('Voice captured', 'success');
            sendAI();
        } else if (interim) {
            input.value = interim;
        }
    };

    recognition.onerror = function(event) {
        isVoiceActive = false;
        btn.classList.remove('active');
        toast('Voice error: ' + event.error, 'error');
    };

    recognition.onend = function() {
        isVoiceActive = false;
        btn.classList.remove('active');
    };

    recognition.start();
};

// ============================================================
// NAVIGATION
// ============================================================
window.goHome = function() { window.location.href = 'index.html'; };
window.goToExplore = function() { window.location.href = 'explore.html'; };
window.goToReels = function() { window.location.href = 'reels.html'; };
window.goToChat = function() { window.location.href = 'chat.html'; };
window.goToChatWith = function(uid) { window.location.href = `chat.html?user=${encodeURIComponent(uid)}`; };
window.goToGroups = function() { window.location.href = 'groups.html'; };
window.goToCalls = function() { window.location.href = 'calls.html'; };
window.goToStatus = function() { window.location.href = 'status.html'; };
window.goToEvents = function() { window.location.href = 'events.html'; };
window.goToAI = function() { window.location.href = 'ai.html'; };
window.goToVault = function() { window.location.href = 'vaults.html'; };
window.goToSettings = function() { window.location.href = 'settings.html'; };

// ============================================================
// AUTH
// ============================================================
window.doLogout = function() {
    if (confirm('Sign out?')) {
        localStorage.removeItem('alpha_token');
        localStorage.removeItem('alpha_user');
        window.location.href = 'index.html';
    }
};

// ============================================================
// INIT
// ============================================================
function initials(name) {
    if (!name) return '?';
    return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

async function init() {
    const savedUser = localStorage.getItem('alpha_user');
    if (CF_TOKEN && savedUser) {
        try {
            const parsed = JSON.parse(savedUser);
            CU = parsed.CU;
            UP = parsed.UP;
        } catch (e) {}
    }

    if (!CF_TOKEN || !CU) {
        window.location.href = 'index.html';
        return;
    }

    const nameEl = document.getElementById('user-name');
    if (nameEl) nameEl.textContent = UP.display_name || 'User';
    const timeEl = document.getElementById('greeting-time');
    if (timeEl) timeEl.textContent = getGreeting();

    const miniName = document.getElementById('me-mini-name');
    if (miniName) miniName.textContent = UP.display_name || 'You';
    const miniAvatar = document.getElementById('me-mini-avatar');
    if (miniAvatar) {
        if (UP.avatar_url) miniAvatar.innerHTML = `<img src="${UP.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="">`;
        else miniAvatar.textContent = initials(UP.display_name);
    }
}

init();
</script>
