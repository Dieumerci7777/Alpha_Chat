<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Alpha — Explore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" rel="stylesheet" />
    <script src="alpha-common.js"></script>
    <style>
        /* ============================================================
           RESET & VARIABLES — identical to index.html
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #f0f2f6;
            --surface: #ffffff;
            --surface-hover: #f4f6fa;
            --surface-raised: #ffffff;
            --text-primary: #0b0d12;
            --text-secondary: #565e70;
            --text-muted: #8e96a8;
            --border: #e4e8ef;
            --border-light: #edf0f5;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.12);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 99px;
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --primary-bg: rgba(79, 70, 229, 0.08);
            --primary-bg-hover: rgba(79, 70, 229, 0.16);
            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.12);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.10);
            --orange: #f59e0b;
            --orange-bg: rgba(245, 158, 11, 0.12);
            --gradient-primary: linear-gradient(135deg, #4f46e5, #7c3aed);
            --gradient-warm: linear-gradient(135deg, #f59e0b, #ef4444);
            --gradient-cool: linear-gradient(135deg, #06b6d4, #3b82f6);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-width: 220px;
            --right-width: 260px;
        }

        [data-theme="dark"] {
            --bg: #0c0e15;
            --surface: #161920;
            --surface-hover: #1e222b;
            --surface-raised: #1a1d26;
            --text-primary: #f1f3f7;
            --text-secondary: #9aa2b5;
            --text-muted: #6e768a;
            --border: #262b36;
            --border-light: #1e222b;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.6);
            --primary-bg: rgba(79, 70, 229, 0.15);
            --primary-bg-hover: rgba(79, 70, 229, 0.25);
            --green-bg: rgba(34, 197, 94, 0.15);
            --red-bg: rgba(239, 68, 68, 0.15);
            --orange-bg: rgba(245, 158, 11, 0.15);
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 15px;
            line-height: 1.6;
        }

        button,
        input,
        textarea {
            font-family: inherit;
            font-size: inherit;
        }
        button {
            color: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }
        *:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
            border-radius: 6px;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        i[class*="fa-"] {
            line-height: 1;
            font-size: 1em;
        }

        /* ============================================================
           APP SHELL — same as index.html
           ============================================================ */
        .app {
            height: 100vh;
            display: grid;
            grid-template-columns: var(--nav-width) minmax(400px, 720px) var(--right-width);
            gap: 16px;
            max-width: 1480px;
            margin: 0 auto;
            padding: 14px 18px 14px 18px;
        }

        /* ============================================================
           LEFT NAVIGATION — identical to index.html
           ============================================================ */
        .left {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 10px 8px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow: hidden;
            height: calc(100vh - 28px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 10px 18px 10px;
            cursor: pointer;
            background: none;
            border: 0;
            text-align: left;
            color: inherit;
            flex-shrink: 0;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.30);
            flex-shrink: 0;
        }

        .brand-name-wrap {
            line-height: 1.2;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-tag {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            -webkit-text-fill-color: var(--text-muted);
        }

        .nav {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex: 1;
            padding: 2px 2px 6px;
            mask-image: linear-gradient(to bottom, #000 calc(100% - 20px), transparent 100%);
        }
        .nav::-webkit-scrollbar {
            width: 0;
        }

        .nav-section-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            padding: 14px 12px 6px;
        }
        .nav-section-label:first-child {
            padding-top: 2px;
        }

        .nav button {
            position: relative;
            border: 0;
            background: transparent;
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            flex-shrink: 0;
            margin-bottom: 1px;
        }

        .nav button:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }

        .nav button.active {
            color: var(--primary);
            background: var(--primary-bg);
            font-weight: 700;
        }
        .nav button.active .nav-icon {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .nav-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: var(--transition);
            font-size: 15px;
        }
        .nav button:hover .nav-icon {
            background: var(--surface-hover);
            color: var(--text-primary);
        }

        .nav-badge {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--red);
            margin-left: auto;
            flex-shrink: 0;
            box-shadow: 0 0 0 2px var(--surface);
        }

        .profile-mini {
            margin-top: 6px;
            background: var(--surface-hover);
            border-radius: var(--radius-md);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .profile-mini:hover {
            background: var(--border-light);
        }

        .profile-mini .name-wrap {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .profile-mini .name {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .profile-mini small {
            color: var(--text-muted);
            font-size: 10.5px;
        }
        .profile-mini .logout-btn {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-size: 13px;
            transition: var(--transition);
        }
        .profile-mini .logout-btn:hover {
            background: var(--red-bg);
            color: var(--red);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
            overflow: hidden;
            color: #fff;
            font-size: 13px;
            background: var(--gradient-primary);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar.g1 {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
        }
        .avatar.g2 {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }
        .avatar.g3 {
            background: linear-gradient(135deg, #22c55e, #06b6d4);
        }
        .avatar.g4 {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
        }
        .avatar.g5 {
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
        }
        .avatar.g6 {
            background: linear-gradient(135deg, #14b8a6, #22c55e);
        }

        /* ============================================================
           CENTER
           ============================================================ */
        .center {
            overflow-y: auto;
            padding: 2px 2px 80px 2px;
            scrollbar-width: none;
            height: calc(100vh - 28px);
        }
        .center::-webkit-scrollbar {
            display: none;
        }

        /* --- HEADER (same as index.html) --- */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 10px;
            background: var(--surface);
            padding: 10px 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        .top::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            opacity: 0.6;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            border: 0;
            background: none;
            cursor: pointer;
            text-align: left;
            color: inherit;
            padding: 4px 2px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            position: relative;
            z-index: 1;
        }
        .top-left:hover {
            opacity: 0.7;
        }

        .top-icon-wrap {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            flex-shrink: 0;
        }

        .top-title-wrap {
            line-height: 1.2;
        }
        .top-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40vw;
        }
        .top-sub {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            -webkit-text-fill-color: var(--text-muted);
        }

        .top-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .circle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            font-size: 15px;
        }
        .circle-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .circle-btn.active {
            color: var(--primary);
            background: var(--primary-bg);
            border-color: var(--primary);
        }

        /* ============================================================
           EXPLORE CONTENT
           ============================================================ */
        .explore-content {
            padding: 0 4px;
        }

        /* Hero */
        .explore-hero {
            background: var(--gradient-primary);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            color: #fff;
            box-shadow: 0 4px 24px rgba(79, 70, 229, 0.30);
        }
        .explore-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.12), transparent 60%);
            pointer-events: none;
        }
        .explore-hero .hero-greeting {
            font-size: 13px;
            opacity: 0.85;
            font-weight: 500;
            margin-bottom: 2px;
        }
        .explore-hero .hero-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        .explore-hero .hero-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .explore-hero .hero-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            padding: 4px 14px 4px 10px;
            border-radius: 99px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 12px;
            font-weight: 500;
        }
        .explore-hero .hero-stat .num {
            font-weight: 700;
            font-size: 15px;
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 14px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .category-btn {
            padding: 6px 16px;
            border: 1px solid var(--border);
            border-radius: 99px;
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .category-btn:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .category-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.35);
        }
        .category-btn i {
            font-size: 13px;
        }

        /* Search */
        .explore-search {
            position: relative;
            margin-bottom: 18px;
        }
        .explore-search input {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-full);
            background: var(--surface);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .explore-search input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-bg), var(--shadow-md);
        }
        .explore-search input::placeholder {
            color: var(--text-muted);
        }
        .explore-search .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        /* Page header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .page-title i {
            margin-right: 8px;
            color: var(--primary);
        }
        .page-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Explore Grid */
        .explore-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .explore-item {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 18px 14px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .explore-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .explore-item .icon-wrap {
            font-size: 36px;
            display: block;
            margin-bottom: 6px;
        }
        .explore-item .name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }
        .explore-item .cat-tag {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 4px;
            font-weight: 600;
        }
        .explore-item .members {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* People List */
        .people-list {
            max-width: 640px;
        }
        .person-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
            transition: var(--transition);
        }
        .person-row:last-child {
            border-bottom: none;
        }
        .person-row:hover {
            padding-left: 4px;
        }
        .person-row .info {
            flex: 1;
            min-width: 0;
        }
        .person-row .name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }
        .person-row .bio {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .person-row .follow-btn {
            padding: 4px 14px;
            border: none;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            flex-shrink: 0;
        }
        .person-row .follow-btn.following {
            background: var(--surface-hover);
            color: var(--text-secondary);
        }
        .person-row .follow-btn.following:hover {
            background: var(--red-bg);
            color: var(--red);
        }
        .person-row .follow-btn.not-following {
            background: var(--gradient-primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.30);
        }
        .person-row .follow-btn.not-following:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.40);
        }

        /* Avatars inline */
        .av {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--border);
            transition: var(--transition);
        }
        .av-primary {
            background: var(--primary-bg);
            color: var(--primary);
        }
        .av-accent {
            background: rgba(124, 58, 237, 0.12);
            color: #7c3aed;
        }
        .av-success {
            background: var(--green-bg);
            color: var(--green);
        }
        .av-warning {
            background: var(--orange-bg);
            color: var(--orange);
        }
        .av-danger {
            background: var(--red-bg);
            color: var(--red);
        }
        .av-mid {
            background: var(--surface-hover);
            color: var(--text-secondary);
        }
        .av img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon-wrap {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .empty-state .empty-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .empty-state .empty-sub {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* ============================================================
           RIGHT PANEL — optional, hidden on explore
           ============================================================ */
        .right {
            display: none;
        }

        /* ============================================================
           MOBILE NAV
           ============================================================ */
        .mobile-nav {
            display: none;
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 10px;
            height: 58px;
            align-items: center;
            justify-content: space-around;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            backdrop-filter: blur(25px);
            border-radius: var(--radius-lg);
            z-index: 1000;
            box-shadow: var(--shadow-lg);
        }
        .mobile-nav button {
            border: 0;
            background: none;
            color: var(--text-muted);
            width: 46px;
            height: 46px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
        }
        .mobile-nav button.active {
            color: var(--primary);
            background: var(--primary-bg);
        }
        .mobile-nav .create {
            background: var(--gradient-primary);
            color: #fff;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.35);
        }
        .mobile-nav .create:hover {
            transform: scale(1.05);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-wrap {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: 380px;
        }
        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-left: 3px solid var(--primary);
            border-radius: var(--radius-md);
            padding: 11px 18px;
            font-size: 13px;
            color: var(--text-primary);
            box-shadow: var(--shadow-lg);
            pointer-events: auto;
            animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transition: var(--transition);
        }
        .toast i {
            font-size: 15px;
            flex-shrink: 0;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(30px) scale(0.95); }
            to { opacity: 1; transform: none; }
        }
        .toast-close {
            background: none;
            border: 0;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 4px;
            margin-left: auto;
            display: flex;
            font-size: 13px;
            transition: var(--transition);
        }
        .toast-close:hover {
            color: var(--red);
        }

        /* ============================================================
           RESPONSIVE — same as index.html
           ============================================================ */
        @media (max-width: 1100px) {
            .app {
                grid-template-columns: 180px minmax(400px, 1fr);
            }
            .right {
                display: none;
            }
            :root {
                --nav-width: 180px;
                --right-width: 0px;
            }
        }

        @media (max-width: 760px) {
            body {
                overflow: hidden;
            }
            .app {
                display: block;
                padding: 0;
                height: 100vh;
            }
            .left {
                display: none;
            }
            .center {
                height: 100vh;
                padding: 10px 12px 80px 12px;
                overflow-y: auto;
            }
            .top {
                padding: 8px 14px;
                border-radius: var(--radius-md);
            }
            .top-title {
                font-size: 17px;
            }
            .top-icon-wrap {
                width: 30px;
                height: 30px;
                font-size: 13px;
            }
            .top-sub {
                font-size: 9px;
            }
            .explore-hero {
                padding: 16px 18px;
                border-radius: var(--radius-md);
            }
            .explore-hero .hero-title {
                font-size: 18px;
            }
            .explore-hero .hero-stat .label {
                display: none;
            }
            .explore-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }
            .explore-item {
                padding: 14px 10px;
            }
            .explore-item .icon-wrap {
                font-size: 28px;
            }
            .explore-item .name {
                font-size: 13px;
            }
            .category-btn {
                font-size: 11px;
                padding: 5px 12px;
            }
            .mobile-nav {
                display: flex;
            }
        }

        @media (max-width: 430px) {
            .explore-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 8px;
            }
            .explore-item {
                padding: 12px 8px;
                border-radius: var(--radius-sm);
            }
            .explore-item .icon-wrap {
                font-size: 24px;
            }
            .explore-item .name {
                font-size: 12px;
            }
            .explore-item .members {
                font-size: 10px;
            }
            .person-row .bio {
                display: none;
            }
        }

        /* ============================================================
           UTILITY
           ============================================================ */
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- ============================================================
        LEFT NAV — identical to index.html
        ============================================================ -->
        <aside class="left">

            <button class="brand" onclick="goTo('index.html')">
                <div class="logo">A</div>
                <div class="brand-name-wrap">

            <nav class="nav">

                <button onclick="goTo('index.html')">

                <button class="active">

                <button onclick="goTo('reels.html')">

                <button onclick="goTo('chat.html')">

        <!-- ============================================================

            <!-- CONTENT -->
            <div class="explore-content">

                <div class="explore-hero">

                        <div class="hero-stat">

                <!-- Categories -->
                <div class="categories" id="categories">

                    </button>
                </div>

                <!-- Search -->
                <div class="explore-search">
                    <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>

                <!-- Page Header -->
                <div class="page-header">

    <nav class="mobile-nav">
        <button onclick="goTo('index.html')"><i class="fa-solid fa-house"></i></button>
        <button class="active"><i class="fa-solid fa-compass"></i></button>
        <button class="create" onclick="goTo('index.html')"><i class="fa-solid fa-plus"></i></button>
        <button onclick="goTo('chat.html')"><i class="fa-solid fa-comment-dots"></i></button>
        <button onclick="goTo('settings.html')"><i class="fa-solid fa-gear"></i></button>
    </nav>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast-wrap" id="toastWrap"></div>

    <script>
        /* ============================================================
           CONFIG
           ============================================================ */
        const CF_API_BASE = 'https://alpha-auth.murwanashyakadieumerci540.workers.dev';
        const TOKEN_KEY = 'alpha_token';
        const USER_KEY = 'alpha_user';

        let CF_TOKEN = localStorage.getItem(TOKEN_KEY) || null;
        let CU = null;
        let UP = { display_name: '', bio: '', avatar_color: 'g2', avatar_url: null };
        let allUsers = {};

        const EXPLORE_ITEMS = [
            { id: 1, name: 'Alpha Tech Meetup', cat: 'tech', icon: '💻', members: 245 },
            { id: 2, name: 'Kigali Art Walk', cat: 'creative', icon: '🎨', members: 189 },
            { id: 3, name: 'Sound of Rwanda', cat: 'music', icon: '🎵', members: 312 },
            { id: 4, name: 'AI & You Workshop', cat: 'tech', icon: '🤖', members: 156 },
            { id: 5, name: 'Digital Art Gallery', cat: 'creative', icon: '🖼️', members: 98 },
            { id: 6, name: 'Kigali Jazz Night', cat: 'music', icon: '🎷', members: 234 },
            { id: 7, name: 'Startup Weekend', cat: 'tech', icon: '🚀', members: 420 },
            { id: 8, name: 'Street Art Festival', cat: 'creative', icon: '🎭', members: 167 },
            { id: 9, name: 'Rwanda Music Festival', cat: 'music', icon: '🎸', members: 500 },
            { id: 10, name: 'Tech Career Fair', cat: 'tech', icon: '💼', members: 310 },
        ];

        /* ============================================================
           DOM REFS
           ============================================================ */
        const toastWrap = document.getElementById('toastWrap');
        const searchInput = document.getElementById('searchInput');

        /* ============================================================
           TOAST
           ============================================================ */
        const TOAST_ICONS = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };

        function toast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML =
                `<i class="fa-solid ${TOAST_ICONS[type] || 'fa-wand-magic-sparkles'}"></i>
                 <span>${msg}</span>
                 <button class="toast-close" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>`;
            toastWrap.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translateX(16px)';
                setTimeout(() => t.remove(), 300);
            }, 3000);
        }

        /* ============================================================
           API HELPER
           ============================================================ */
        async function cfApi(endpoint, method = 'GET', payload = null) {
            const opts = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };
            if (CF_TOKEN) opts.headers['Authorization'] = `Bearer ${CF_TOKEN}`;
            if (payload) opts.body = JSON.stringify(payload);

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 15000);
            opts.signal = controller.signal;

            let res;
            try {
                res = await fetch(`${CF_API_BASE}${endpoint}`, opts);
            } catch (e) {
                clearTimeout(timer);
                throw new Error(e.name === 'AbortError' ? 'Request timed out — check your connection' : e.message);
            }
            clearTimeout(timer);

            let data = {};
            try { data = await res.json(); } catch (e) { data = {}; }
            if (!res.ok) throw new Error(data.error || data.message || `Request failed (${res.status})`);
            return data;
        }

        /* ============================================================
           UTILITIES
           ============================================================ */
        function initials(n) {
            return (n || '?').split(' ').map(w => w[0] || '').join('').toUpperCase().slice(0, 2) || '?';
        }

        function avHTML(uid, sz = 32, fs = 11) {
            const u = allUsers[uid] || {};
            const cl = u.avatar_color || 'av-primary';
            const ini = initials(u.display_name || '?');
            if (u.avatar_url) {
                return `<div class="av" style="width:${sz}px;height:${sz}px;"><img src="${u.avatar_url}" alt=""></div>`;
            }
            return `<div class="av ${cl}" style="width:${sz}px;height:${sz}px;font-size:${fs}px">${ini}</div>`;
        }

        function followsKey() { return 'alpha_follows_' + (CU?.id || 'guest'); }

        function loadFollows() { try { return JSON.parse(localStorage.getItem(followsKey()) || '[]'); } catch (e) { return []; } }

        function saveFollows(list) { localStorage.setItem(followsKey(), JSON.stringify(list)); }

        function isFollowing(uid) { return loadFollows().includes(uid); }

        function toggleFollow(uid) {
            let list = loadFollows();
            const name = allUsers[uid]?.display_name || 'User';
            if (list.includes(uid)) {
                list = list.filter(x => x !== uid);
                toast('Unfollowed ' + name, 'info');
            } else {
                list.push(uid);
                toast('Following ' + name + ' ✦');
            }
            saveFollows(list);
            renderExplore();
        }

        function followButtonHTML(uid) {
            const f = isFollowing(uid);
            return `<button class="follow-btn ${f ? 'following' : 'not-following'}" onclick="event.stopPropagation();toggleFollow('${uid}')">${f ? 'Following' : 'Follow'}</button>`;
        }

        function goTo(url) { window.location.href = url; }

        /* ============================================================
           GREETING
           ============================================================ */
        function getGreeting() {
            const h = new Date().getHours();
            if (h < 12) return 'Good Morning 🌅';
            if (h < 17) return 'Good Afternoon ☀️';
            if (h < 21) return 'Good Evening 🌇';
            return 'Good Night 🌙';
        }

        /* ============================================================
           THEME
           ============================================================ */
        function initTheme() {
            const saved = localStorage.getItem('alpha_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        }

        function toggleTheme() {
            const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', cur);
            localStorage.setItem('alpha_theme', cur);
        }

        document.getElementById('topThemeButton').addEventListener('click', () => {
            toggleTheme();
            toast(document.documentElement.getAttribute('data-theme') === 'dark' ? 'Dark mode enabled' :
                'Light mode enabled');
        });

        initTheme();

        /* ============================================================
           USERS
           ============================================================ */
        async function loadUsers() {
            try {
                const data = await cfApi('/users');
                data.forEach(u => allUsers[u.email] = u);
                document.getElementById('userCount').textContent = Object.keys(allUsers).length;
            } catch (e) { console.warn('Load users error:', e); }
        }

        /* ============================================================
           SEARCH
           ============================================================ */
        function doSearch(val) {
            const q = val.toLowerCase().trim();
            const el = document.getElementById('resultCount');
            if (!q) {
                el.textContent = 'Showing all';
                renderExplore();
                return;
            }
            const filtered = EXPLORE_ITEMS.filter(item =>
                item.name.toLowerCase().includes(q) ||
                item.cat.toLowerCase().includes(q)
            );
            el.textContent = `${filtered.length} result${filtered.length === 1 ? '' : 's'}`;
            renderExplore('all', filtered);
        }

        /* ============================================================
           FILTER
           ============================================================ */
        function filterExplore(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.getElementById('resultCount').textContent = cat === 'all' ? 'Showing all' : `Showing ${cat}`;
            renderExplore(cat);
        }

        /* ============================================================
           RENDER EXPLORE
           ============================================================ */
        function renderExplore(cat = 'all', items = null) {
            const el = document.getElementById('exploreContent');
            if (!el) return;

            const data = items || EXPLORE_ITEMS;

            if (cat === 'people') {
                const others = Object.values(allUsers).filter(u => u.email !== CU?.id);
                if (!others.length) {
                    el.innerHTML = `
                        <div class="empty-state">
                            <span class="icon-wrap">👤</span>
                            <div class="empty-title">No people to show yet</div>
                            <div class="empty-sub">Invite friends or explore communities</div>
                        </div>
                    `;
                    return;
                }
                el.innerHTML = `<div class="people-list">${others.map(u => `
                    <div class="person-row">
                        ${avHTML(u.email, 40, 13)}
                        <div class="info">
                            <div class="name">${u.display_name}</div>
                            <div class="bio">${u.bio || 'Alpha member'}</div>
                        </div>
                        ${followButtonHTML(u.email)}
                    </div>
                `).join('')}</div>`;
                return;
            }

            let filtered = data;
            if (cat === 'trending') {
                filtered = [...data].sort((a, b) => b.members - a.members).slice(0, 4);
            } else if (cat !== 'all') {
                filtered = data.filter(item => item.cat === cat);
            }

            if (!filtered.length) {
                el.innerHTML = `
                    <div class="empty-state">
                        <span class="icon-wrap">🔍</span>
                        <div class="empty-title">Nothing found</div>
                        <div class="empty-sub">Try adjusting your search or filter</div>
                    </div>
                `;
                return;
            }

            el.innerHTML = `<div class="explore-grid">${filtered.map(item => `
                <div class="explore-item" onclick="toast('Opening ${item.name}…', 'info')">
                    <span class="icon-wrap">${item.icon}</span>
                    <div class="name">${item.name}</div>
                    <div class="cat-tag">${item.cat}</div>
                    <div class="members"><i class="fa-solid fa-users"></i> ${item.members || 0} members</div>
                </div>
            `).join('')}</div>`;
        }

        /* ============================================================
           LOGOUT
           ============================================================ */
        function doLogout() {
            if (confirm('Sign out?')) {
                localStorage.removeItem(TOKEN_KEY);
                localStorage.removeItem(USER_KEY);
                window.location.href = 'login.html';
            }
        }

        /* ============================================================
           APPLY PROFILE TO CHROME
           ============================================================ */
        function applyProfileToChrome() {
            const name = UP.display_name || (CU && CU.email ? CU.email.split('@')[0] : 'User');
            const handle = '@' + ((CU && CU.email) || 'user').split('@')[0];

            const avEl = document.getElementById('me-mini-avatar');
            if (avEl) {
                if (UP.avatar_url) {
                    avEl.innerHTML = `<img src="${UP.avatar_url}" alt="">`;
                } else {
                    avEl.textContent = (name || '?').slice(0, 2).toUpperCase();
                    avEl.className = 'avatar g2';
                }
            }
            document.getElementById('me-mini-name').textContent = name;
            document.getElementById('me-mini-handle').textContent = handle;
        }

        /* ============================================================
           INIT
           ============================================================ */
        async function init() {
            const savedUser = localStorage.getItem(USER_KEY);
            if (CF_TOKEN && savedUser) {
                try {
                    const parsed = JSON.parse(savedUser);
                    CU = parsed.CU;
                    UP = parsed.UP || UP;
                } catch (e) {}
            }

            if (!CF_TOKEN || !CU) {
                window.location.href = 'login.html';
                return;
            }

            applyProfileToChrome();
            document.getElementById('heroGreeting').textContent = getGreeting();

            await loadUsers();
            renderExplore('all');
        }

        init();
    </script>
